     search engines are asked not to index the app -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://vvkkxphkyjejyhbcdcuw.supabase.co https://api.open-meteo.com; media-src 'self' blob: data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

<meta name="theme-color" content="#111A19" media="(prefers-color-scheme: dark)">

<style>
/* Layout: one phone screen; only unchecked chips show per category, checked ones drop to a quiet "Vérifié" tray at the bottom */
body { font-size: 14px; }
.wrap { gap: 12px; padding-bottom: 18px; }
/* Under the title: weather, progress, reset */
.head2 { display: flex; align-items: center; gap: 10px; }
.head2 .count { margin-left: auto; }
.wx { text-decoration: none; -webkit-tap-highlight-color: transparent; display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wx[hidden] { display: none; }
.wx svg { width: 18px; height: 18px; align-self: center; }
.wx small { font-size: 0.75rem; font-weight: 600; margin-left: 4px; opacity: 0.85; }
.count { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count b { color: var(--accent); font-weight: 800; font-size: 1.25rem; }
.alerts { display: flex; flex-direction: column; gap: 4px; margin-top: -4px; }
.alerts:empty { display: none; }
.alerts a { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 700; color: var(--accent); text-decoration: none; -webkit-tap-highlight-color: transparent; }
.alerts svg { width: 16px; height: 16px; flex: none; }
.alerts span { font-weight: 400; color: var(--muted); }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
.list { display: flex; flex-direction: column; gap: 12px; }
section { display: flex; flex-direction: column; gap: 6px; }
h2 { margin: 0; display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
h2 span { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
.chip {
  font: inherit; font-size: 0.9rem; line-height: 1.2; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 11px 6px 9px; display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent;
}
.chip::before { content: ""; width: 14px; height: 14px; flex: none; border-radius: 50%; border: 1.5px solid var(--line); }
.chip small { color: var(--muted); font-size: 0.75rem; }
/* Optional: faded, dashed outline, no fill */
.chip.opt { background: transparent; color: var(--muted); border-style: dashed;
  border-color: var(--muted); border-color: color-mix(in srgb, var(--muted) 55%, transparent); }
.chip.opt::before { border-style: dashed; }
.group {
  display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px;
  background: var(--group); border: 1px dashed var(--line); border-radius: 14px; padding: 5px 6px 6px;
}
.group-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 4px; width: 100%; }
.chip:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Check feedback: fill + tick pop, then the chip folds away */
.chip {
  position: relative; white-space: nowrap; max-width: 100%; overflow: hidden;
  transition: background .08s, color .08s, border-color .08s, opacity .15s ease, transform .15s ease,
              max-width .17s ease, padding .17s ease, border-width .17s ease;
}
.chip.checking { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: pop .16s ease; }
.chip.checking small { color: var(--accent-ink); opacity: .8; }
.chip.checking::before { background: var(--accent-ink); border-color: var(--accent-ink); }
.chip.checking::after {
  content: ""; position: absolute; left: 14px; top: 50%; width: 4px; height: 8px; margin-top: -6px;
  border: solid var(--accent); border-width: 0 2px 2px 0;
  transform: rotate(45deg) scale(0); animation: tick .1s .02s ease-out forwards;
}
.chip.leaving { opacity: 0; transform: scale(.85); max-width: 0 !important; padding-left: 0; padding-right: 0; border-width: 0; }
.chip.arrive { animation: arrive .4s ease; }
.count b.bump { display: inline-block; animation: bump .2s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes tick { to { transform: rotate(45deg) scale(1); } }
@keyframes arrive {
  0% { opacity: 0; transform: translateY(-4px) scale(.9); background: var(--accent); color: var(--accent-ink); }
  35% { opacity: 1; transform: none; background: var(--accent); color: var(--accent-ink); }
}
@keyframes bump { 40% { transform: scale(1.3); } }
@media (prefers-reduced-motion: reduce) {
  .chip { transition: background .15s, color .15s; }
  .chip.checking, .chip.checking::after, .chip.arrive, .count b.bump { animation: none; }
  .chip.checking::after { transform: rotate(45deg); }
}

.done { border-top: 1px solid var(--line); padding-top: 10px; }
.done h2 { color: var(--accent); }
.done .chip { background: transparent; color: var(--muted); border-color: var(--line); font-size: 0.82rem; padding: 4px 9px 4px 7px; }
.done .chip span { text-decoration: line-through; text-decoration-color: var(--line); }
.done .chip::before { width: 12px; height: 12px; border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 2px var(--bg); }
.done .chip small { display: none; }

.allset { text-align: center; padding: 18px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.allset strong { display: block; font-family: var(--font-display); font-size: 1.3rem; color: var(--accent); }
.allset span { color: var(--muted); font-size: 0.85rem; }
/* Celebration when the last item is checked */
.allset.party { position: relative; overflow: visible; animation: party-in .6s cubic-bezier(.3,1.6,.5,1); }
.allset.party strong { animation: wiggle .7s .5s ease-in-out 2; }
.confetti { position: absolute; left: 50%; top: 40%; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; opacity: 0;
  animation: confetti 1.3s cubic-bezier(.15,.7,.4,1) forwards; animation-delay: var(--d); }
@keyframes party-in { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: none; } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3deg) scale(1.05); } 75% { transform: rotate(3deg) scale(1.05); } }
@keyframes confetti {
  0% { opacity: 1; transform: translate(-50%, -50%) rotate(0); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)); }
}
@media (prefers-reduced-motion: reduce) { .allset.party, .allset.party strong { animation: none; } .confetti { display: none; } }

footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 4px; }
.msg { color: var(--muted); font-size: 0.85rem; }
.reset { font: inherit; font-size: 0.85rem; font-weight: 700; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.reset.confirm { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <a class="back" href="./" aria-label="Retour à l'accueil"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Checklist sortie</h1>
  </header>
  <div class="head2">
    <a class="wx" id="wx" href="meteo.html" hidden></a>
    <div class="count"><b id="done">0</b>/<span id="total">0</span></div>
    <button class="reset" id="reset" type="button">Réinitialiser</button>
  </div>
  <div class="alerts" id="alerts"></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="list" id="todo"></div>
  <section class="done" id="doneSec" hidden>
    <h2>Vérifié <span id="doneCount"></span></h2>
    <div class="chips" id="doneList"></div>
  </section>
  <footer>
    <span class="msg" id="msg">Touche un élément quand il est dans le sac.</span>
  </footer>
</div>

<script src="config.js"></script>
<script src="famille.js"></script>
<script src="sync.js"></script>
<script>
// An item is [label, hint, OPT?] or {group, items:[[label, hint], ...]}
// Optional items: shown and checkable, but not needed for "Prêt pour l'aventure".
const OPT = "facultatif";
const DATA = [
  ["Repas", [
    ["Biberons de lait maternel", "1 × 150 ml par 3 h"],
    ["Nourrette de formule"],
    ["Bavoir"],
    ["Bloc réfrigérant", "", OPT],
    ["Tire-lait", "si sortie de 4 h ou plus", OPT],
    ["Linge à rot", "", OPT]
  ]],
  ["Change", [
    ["Thomas a-t-il besoin d'être changé ?"],
    { group: "Sac à couches", items: [
      ["Couches", "1 par 2 h + 2"],
      ["Lingettes"],
      ["Crème pour les fesses", "", OPT]
    ]},
    ["Tapis à langer"],
    ["Sacs pour couches sales"],
    ["Débarbouillettes"],
    ["Désinfectant pour les mains"]
  ]],
  ["Vêtements et confort", [
    ["Rechange complet", "×2"],
    ["Lange"],
    ["Suce + attache-suce"],
    ["Doudou"],
    ["Livre ou jouet"],
    ["Anneau de dentition"],
    ["Chapeau", "", OPT],
    ["Bonnet", "", OPT],
    ["Pull", "", OPT],
    ["Couverture", "selon météo", OPT],
    ["Chaussettes", "selon météo", OPT],
    ["Ventilateur", "chargé", OPT],
    ["Porte-bébé", "", OPT]
  ]],
  ["Santé et papiers", [
    ["Carnet de santé"],
    ["Carte d'assurance maladie"]
  ]],
  ["Parents", [
    ["Eau", "", OPT],
    ["Collations", "", OPT],
    ["Rechange pour nous", "", OPT]
  ]]
];

// Each item's id is its label, so items can be added, removed or moved freely
// without mixing up what is checked.
const leaves = [];
const leaf = ([label, hint, opt], cat, group) => {
  const l = { id: label, cat, group, label, hint, opt: opt === OPT };
  leaves.push(l);
  return l;
};
const CATS = DATA.map(([name, items], ci) => ({
  name,
  entries: items.map(it => Array.isArray(it)
    ? leaf(it, ci)
    : { group: it.group, items: it.items.map(sub => leaf(sub, ci, it.group)) })
}));
const required = leaves.filter(l => !l.opt);
const total = required.length; // the counter and "all set" only look at required items
document.getElementById("total").textContent = total;

const KEY = "sortie-bebe-v3"; // v3: ids are labels (v2 used positions)
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

// ---------- Shared between both phones (Supabase table "checklist") ----------
// Each change is sent right away; what the other phone checked shows up within a few seconds.
// Offline, changes wait in UNSENT and go out when the network is back.
const cfg = self.T911 || {};
const SHARED = !!(cfg.SUPABASE_URL && cfg.SUPABASE_KEY);
const UNSENT = "sortie-bebe-attente";
let unsent = {};
try { unsent = JSON.parse(localStorage.getItem(UNSENT) || "{}") || {}; } catch (e) {}
const api = (path, opts = {}) => fetch(`${cfg.SUPABASE_URL}/rest/v1/${path}`, {
  ...opts, headers: { apikey: cfg.SUPABASE_KEY, "Content-Type": "application/json", ...(opts.headers || {}) }
}).then((r) => { if (!r.ok) throw new Error(r.status); return r; });
// Record a change (val: checked or not) for the other phone
function share(ids, val) {
  if (!SHARED) return;
  ids.forEach((id) => { unsent[id] = val; });
  try { localStorage.setItem(UNSENT, JSON.stringify(unsent)); } catch (e) {}
  push();
}
let pushing = false;
function push() {
  const ids = Object.keys(unsent);
  if (!SHARED || pushing || !ids.length) return Promise.resolve();
  pushing = true;
  const sent = { ...unsent };
  return api("checklist", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(ids.map((cle) => ({ cle, fait: sent[cle], maj: new Date().toISOString() }))) })
    .then(() => {
      for (const k in sent) if (unsent[k] === sent[k]) delete unsent[k];
      try { localStorage.setItem(UNSENT, JSON.stringify(unsent)); } catch (e) {}
    })
    .catch(() => {})
    .finally(() => { pushing = false; });
}
// Take what the other phone did. Not while you're tapping (chips waiting to fold away).
function pull() {
  if (!SHARED || document.visibilityState !== "visible") return;
  push().then(() => api("checklist?select=cle,fait")).then((r) => r.json()).then((rows) => {
    if (pending.size || flushing) return;
    // Very first sync (nothing on the server yet): this phone's ticks seed it instead of being wiped
    if (!rows.length) { share(leaves.filter((l) => state[l.id]).map((l) => l.id), true); return; }
    const next = {};
    rows.forEach(({ cle, fait }) => { if (fait) next[cle] = 1; });
    for (const [k, v] of Object.entries(unsent)) { if (v) next[k] = 1; else delete next[k]; }
    const same = leaves.every((l) => !!next[l.id] === !!state[l.id]);
    if (same) return;
    leaves.forEach((l) => { if (next[l.id]) state[l.id] = 1; else delete state[l.id]; });
    save(); render();
  }).catch(() => {});
}

const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
// Checked chips stay in place while you tap (tap again to undo).
// After IDLE ms without a tap, they all fold away together and move to "Vérifié".
const IDLE = 2000;
const FOLD = reduced ? 0 : 200;
let idleTimer = null, flushing = false;
const pending = new Set();
const arrivals = new Set();

function armIdle() {
  clearTimeout(idleTimer);
  idleTimer = pending.size ? setTimeout(flush, IDLE) : null;
}

function flush() {
  clearTimeout(idleTimer); idleTimer = null;
  if (flushing) return;
  const els = [...pending].map(id => document.getElementById("t-" + id)).filter(Boolean);
  pending.forEach(id => arrivals.add("d-" + id));
  pending.clear();
  if (!els.length || !FOLD) { render(); return; }
  flushing = true;
  els.forEach(el => { el.style.maxWidth = el.offsetWidth + "px"; });
  void document.body.offsetWidth;
  els.forEach(el => el.classList.add("leaving"));
  setTimeout(() => { flushing = false; render(); }, FOLD);
}

function chip(leaf, prefix) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.id = prefix + leaf.id;
  if (leaf.opt) b.classList.add("opt");
  b.innerHTML = `<span>${leaf.label}</span>` + (leaf.hint ? ` <small>${leaf.hint}</small>` : "");
  b.setAttribute("aria-label", (state[leaf.id] ? "Décocher " : "Cocher ") + leaf.label + (leaf.opt ? " (facultatif)" : ""));
  b.addEventListener("click", () => {
    if (flushing) return;
    window.buzz && buzz(); // tap feedback, from app.js
    if (prefix === "d-") {
      tick();
      // Uncheck from the tray: bring it back, highlighted where it lands
      delete state[leaf.id]; save(); share([leaf.id], false);
      arrivals.add("t-" + leaf.id);
      flush();
      return;
    }
    if (pending.has(leaf.id)) {
      // Undo in place, before it has moved
      tick();
      pending.delete(leaf.id); delete state[leaf.id]; save(); share([leaf.id], false);
      b.classList.remove("checking");
      updateCounts(false);
    } else {
      const wasReady = required.every(l => state[l.id]);
      pending.add(leaf.id); state[leaf.id] = 1; save(); share([leaf.id], true);
      b.classList.add("checking");
      if (updateCounts(true) === total && !wasReady) {
        // Last one: celebrate now, while we're still inside the tap (iPhone only plays sound then)
        celebrate();
        clearTimeout(idleTimer);
        idleTimer = setTimeout(flush, reduced ? 0 : 450);
        return;
      }
      // Last required item of its section: coin sound instead of the click
      const sectionDone = !leaf.opt && required.every(l => l.cat !== leaf.cat || state[l.id]);
      sectionDone ? coin() : tick();
    }
    armIdle();
  });
  return b;
}

// Celebration: chime + a cheerful spoken line, then confetti when the "all set" card appears.
let party = false, audio = null;
function getAudio() {
  if (!audio) {
    // "ambient": follows the iPhone silent switch and doesn't pause music or podcasts
    try { if (navigator.audioSession) navigator.audioSession.type = "ambient"; } catch (e) {}
    audio = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audio.state === "suspended") audio.resume();
  return audio;
}
// Very soft key click, like the iPhone keyboard: a few ms of filtered noise.
let clickBuf = null;
function tick() {
  try {
    const ctx = getAudio();
    if (!clickBuf) {
      clickBuf = ctx.createBuffer(1, Math.round(ctx.sampleRate * 0.03), ctx.sampleRate);
      const d = clickBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.004));
    }
    const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = clickBuf;
    bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 0.9;
    g.gain.value = 0.24;
    src.connect(bp).connect(g).connect(ctx.destination);
    src.start();
  } catch (e) {}
}
// Retro coin pickup (two quick square-wave notes, B5 then E6), same soft level as the click.
function coin() {
  try {
    const ctx = getAudio(), t0 = ctx.currentTime + 0.01;
    [[987.77, 0, 0.08], [1318.51, 0.08, 0.45]].forEach(([f, at, len]) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = t0 + at;
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.1, t);
      g.gain.setValueAtTime(0.1, t + Math.min(len, 0.1) - 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + len + 0.02);
    });
  } catch (e) {}
}
function chime() {
  try {
    getAudio();
    const t0 = audio.currentTime + 0.02;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { // C E G C
      const o = audio.createOscillator(), g = audio.createGain(), t = t0 + i * 0.11;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (i === 3 ? 0.9 : 0.3));
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 1);
    });
  } catch (e) {}
}
function cheer() {
  try {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance("Prêt pour l'aventure avec Thomas !");
    const voices = synth.getVoices();
    const v = voices.find(v => v.lang === "fr-CA") || voices.find(v => v.lang && v.lang.startsWith("fr"));
    if (v) u.voice = v;
    u.lang = v ? v.lang : "fr-CA"; u.rate = 1.05; u.pitch = 1.35;
    synth.speak(u);
  } catch (e) {}
}
function celebrate() {
  party = true;
  chime(); cheer();
  try { if (navigator.vibrate) navigator.vibrate([30, 60, 30, 60, 80]); } catch (e) {}
}
function confetti(card) {
  if (reduced || !card) return;
  const colors = ["var(--accent)", "#f4b942", "#ef7b6c", "#7cc68d", "#8fa8f0"];
  for (let i = 0; i < 28; i++) {
    const c = document.createElement("i"); c.className = "confetti";
    const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 90;
    c.style.cssText = `background:${colors[i % colors.length]};--x:${Math.cos(a) * d * 1.6}px;--y:${Math.sin(a) * d - 30}px;--r:${(Math.random() * 720 - 360) | 0}deg;--d:${(Math.random() * 0.15).toFixed(2)}s`;
    card.appendChild(c);
  }
  setTimeout(() => card.querySelectorAll(".confetti").forEach(c => c.remove()), 1800);
}

const todo = document.getElementById("todo");
const doneList = document.getElementById("doneList");

function updateCounts(bump) {
  const done = required.filter(l => state[l.id]).length;
  try { localStorage.setItem("sortie-bebe-progress", JSON.stringify({ done, total })); } catch (e) {} // shown on the home page
  const d = document.getElementById("done");
  d.textContent = done;
  document.getElementById("fill").style.width = (done / total * 100) + "%";
  document.getElementById("msg").textContent = done === total
    ? "Touche un élément vérifié pour le remettre."
    : `Il reste ${total - done} élément${total - done > 1 ? "s" : ""}.`;
  if (bump && !reduced) { d.classList.remove("bump"); void d.offsetWidth; d.classList.add("bump"); }
  return done;
}

function render() {
  clearTimeout(idleTimer); idleTimer = null; pending.clear();
  todo.innerHTML = ""; doneList.innerHTML = "";
  let done = 0;
  CATS.forEach(({ name: cat, entries }, ci) => {
    const catLeaves = leaves.filter(l => l.cat === ci);
    const open = catLeaves.filter(l => !state[l.id]);
    if (!open.length) return;
    const catReq = catLeaves.filter(l => !l.opt);
    const sec = document.createElement("section");
    const h = document.createElement("h2");
    h.innerHTML = `${cat}<span>${catReq.length ? `${catReq.filter(l => state[l.id]).length}/${catReq.length}` : ""}</span>`;
    const wrap = document.createElement("div"); wrap.className = "chips";
    // Required items first, optional ones at the end of the section
    const later = [];
    entries.forEach(e => {
      if (!e.items) {
        if (state[e.id]) return;
        if (e.opt) later.push(e); else wrap.appendChild(chip(e, "t-"));
      } else {
        const sub = e.items.filter(l => !state[l.id]);
        if (!sub.length) return;
        const g = document.createElement("div"); g.className = "group";
        g.innerHTML = `<div class="group-label">${e.group}</div>`;
        sub.forEach(l => g.appendChild(chip(l, "t-")));
        wrap.appendChild(g);
      }
    });
    later.forEach(l => wrap.appendChild(chip(l, "t-")));
    sec.append(h, wrap);
    todo.appendChild(sec);
  });
  leaves.forEach(l => { if (state[l.id]) { done++; doneList.appendChild(chip(l, "d-")); } });

  if (required.every(l => state[l.id])) {
    // All set: the card goes on top; any unchecked optional items stay below it
    const left = todo.childElementCount;
    todo.insertAdjacentHTML("afterbegin", `<div class="allset${party ? " party" : ""}"><strong>Prêt pour l'aventure avec Thomas !</strong><span>${left ? "L'essentiel est dans le sac. Le reste est facultatif." : "Tout est dans le sac. Bonne sortie !"}</span></div>`);
    if (party) { window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" }); confetti(todo.firstChild); }
  }
  party = false;
  document.getElementById("doneSec").hidden = done === 0;
  document.getElementById("doneCount").textContent = done;
  updateCounts(false);
  arrivals.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add("arrive"); });
  arrivals.clear();
}

const reset = document.getElementById("reset");
let armed = null;
reset.addEventListener("click", () => {
  if (!armed) {
    reset.classList.add("confirm"); reset.textContent = "Confirmer";
    armed = setTimeout(() => { armed = null; reset.classList.remove("confirm"); reset.textContent = "Réinitialiser"; }, 3000);
    return;
  }
  clearTimeout(armed); armed = null;
  state = {}; save(); share(leaves.map((l) => l.id), false);
  reset.classList.remove("confirm"); reset.textContent = "Réinitialiser";
  render();
});

render();
pull();
setInterval(pull, 4000); // only fetches while the page is on screen
document.addEventListener("visibilitychange", pull);
window.addEventListener("online", pull);
</script>

<script src="weather.js"></script>
<script>
// Weather in the header: icon + temperature (+ min/max until 18 h) and rain/wind alerts.
Wx.onUpdate((w) => {
  const el = document.getElementById("wx");
  const [icon, label] = Wx.kind(w.code, w.day);
  const t = Math.round(w.temp);
  const range = Wx.range(w);
  el.innerHTML = Wx.svg(Wx.PATHS[icon]) + `${t}°` + (range ? `<small>↓${range[0]}° ↑${range[1]}°</small>` : "");
  const desc = `${label}, ${t} degrés` + (range ? `, minimum ${range[0]}, maximum ${range[1]} d'ici ${Wx.UNTIL} h` : "");
  el.setAttribute("aria-label", desc + ". Ouvrir la météo détaillée");
  el.title = desc;
  el.hidden = false;
  document.getElementById("alerts").innerHTML = Wx.alerts(w).map(([path, text, detail]) =>
    `<a href="meteo.html">${Wx.svg(path)}${text} <span>${detail}</span></a>`).join("");
});
Wx.refresh();
</script>
