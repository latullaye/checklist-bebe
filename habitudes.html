<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
<title>Bonnes habitudes · THOMAS911</title>
<style>
/* Day picker */
.day-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.day-nav strong { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.day-nav strong::first-letter { text-transform: uppercase; }
.day-nav small { display: block; color: var(--muted); font-size: 0.8rem; font-weight: 400; font-family: var(--font-body); }
.arrow { font: inherit; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--accent);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; flex: none; }
.arrow:disabled { opacity: .3; cursor: default; }
.arrow svg { width: 20px; height: 20px; }

/* Grid: one row per habit, one column per moment of the day */
.grid { display: grid; grid-template-columns: 1fr repeat(3, 56px); align-items: center; row-gap: 10px; column-gap: 4px; margin-top: 14px; }
.grid .col { text-align: center; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 3px 0; border-radius: 8px; }
.grid .col.now { color: var(--accent); background: var(--accent-soft); }
.hab b { display: block; font-size: 0.98rem; line-height: 1.2; }
.hab span { color: var(--muted); font-size: 0.8rem; }
.tick { justify-self: center; width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); color: var(--accent-ink);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; padding: 0; transition: background .15s, border-color .15s, transform .1s; }
.tick svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .15s; }
.tick.now { border-color: var(--accent); }
.tick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.tick[aria-pressed="true"] svg { opacity: 1; }
.tick:active { transform: scale(.92); }

/* Bath */
.once { display: flex; flex-direction: column; gap: 12px; }
.bath { display: flex; align-items: center; gap: 12px; }
.once .bath + .bath { padding-top: 12px; border-top: 1px solid var(--line); }
.bath .txt { flex: 1; min-width: 0; }
.bath b { display: block; }
.bath .txt > span { color: var(--muted); font-size: 0.85rem; }

/* Last days */
.hist { display: grid; grid-template-columns: auto 1fr 1fr 48px 24px; gap: 6px 12px; align-items: center; margin-top: 10px; font-size: 0.85rem; }
.hist .h { white-space: nowrap; font-size: 0.7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.hist .d { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; }
.hist .d.sel { color: var(--accent); font-weight: 700; }
.dots { display: flex; gap: 5px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.on { background: var(--accent); border-color: var(--accent); }
.hist .tub { width: 20px; height: 20px; color: var(--accent); }

/* Reminders: one line, the switch lives in Settings */
.remind { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
.remind svg.bell { width: 22px; height: 22px; color: var(--accent); }
.remind .txt { flex: 1; min-width: 0; }
.remind b { display: block; font-size: 0.95rem; }
.remind .txt > span { display: block; color: var(--muted); font-size: 0.8rem; }
.remind .go { width: 20px; height: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="./" aria-label="Retour à l'accueil"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Bonnes habitudes</h1>
  </header>

  <section class="card">
    <div class="day-nav">
      <button class="arrow" id="prev" type="button" aria-label="Jour précédent"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div style="text-align:center"><strong id="dayName"></strong><small id="dayDate"></small></div>
      <button class="arrow" id="next" type="button" aria-label="Jour suivant"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="card once">
    <div class="bath">
      <span class="txt"><b>Vitamine D</b><span>Une fois par jour</span></span>
      <button class="tick" id="vitd" type="button" aria-label="Vitamine D donnée ce jour-là"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div>
    <div class="bath">
      <span class="txt"><b>Bain</b><span id="bathLast"></span></span>
      <button class="tick" id="bath" type="button" aria-label="Bain donné ce jour-là"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div>
  </section>

  <section class="card">
    <div class="label">7 derniers jours</div>
    <div class="hist" id="hist"></div>
  </section>

  <a class="card remind" href="reglages.html#rappels">
    <svg class="i bell" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
    <span class="txt"><b id="remindTitle">Rappels</b><span id="remindSub">9 h, 12 h 30 et 17 h 30, s'il reste quelque chose à faire</span></span>
    <svg class="i go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </a>
</div>

<script src="config.js"></script>
<script src="famille.js"></script>
<script src="sync.js"></script>
<script src="habits.js"></script>
<script src="notifs.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const TUB = '<svg class="i tub" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18v2a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5v-2Z M6 12V6a2 2 0 0 1 3.7-1 M7 19l-1 2 M17 19l1 2"/></svg>';
const { SLOTS, HABITS } = Habits;
let day = Habits.today();

// A reminder's "C'est fait" that couldn't reach the network opens ?fait=jour|matin
const q = new URLSearchParams(location.search);
if (q.get("fait")) {
  const [jour, slot] = q.get("fait").split("|");
  Habits.REMIND(slot).forEach((k) => Habits.set(jour, k, true));
  history.replaceState(null, "", location.pathname);
}

const label = (d) => {
  const t = Habits.today();
  if (d === t) return "aujourd'hui";
  if (d === Habits.addDays(t, -1)) return "hier";
  return new Date(d + "T12:00:00").toLocaleDateString("fr-CA", { weekday: "long" });
};
const longDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("fr-CA", { day: "numeric", month: "long" });

const buzz = () => window.buzz && window.buzz(); // tap feedback, from app.js

function render() {
  const t = Habits.today(), now = day === t ? Habits.slotNow() : null;
  $("dayName").textContent = label(day);
  $("dayDate").textContent = longDate(day);
  $("next").disabled = day >= t;
  $("prev").disabled = day <= Habits.addDays(t, -13);

  $("grid").innerHTML = "<span></span>" + SLOTS.map(([s, name]) => `<span class="col${s === now ? " now" : ""}">${name}</span>`).join("")
    + HABITS.map(([h, name, who]) => `<span class="hab"><b>${name}</b>${who ? `<span>${who}</span>` : ""}</span>`
      + SLOTS.map(([s, sn]) => `<button class="tick${s === now ? " now" : ""}" type="button" data-key="${h}-${s}"
          aria-pressed="${Habits.get(day, `${h}-${s}`)}" aria-label="${name}, ${sn.toLowerCase()}">${CHECK}</button>`).join("")).join("");

  $("vitd").setAttribute("aria-pressed", Habits.get(day, "vitd"));
  $("bath").setAttribute("aria-pressed", Habits.get(day, "bain"));
  // Every 2 or 3 days, in the evening: due from the 2nd day
  const ago = Habits.bathAgo();
  $("bathLast").textContent = (ago === null ? "Pas de bain noté" : ago === 0 ? "Dernier bain aujourd'hui"
    : `Dernier bain ${ago === 1 ? "hier" : `il y a ${ago} jours`}`) + (Habits.bathDue() ? " · à donner ce soir" : " · tous les 2 à 3 jours");

  const rows = [];
  for (let i = 0; i < 7; i++) {
    const d = Habits.addDays(t, -i);
    const dots = (h) => `<span class="dots">${SLOTS.map(([s]) => `<i class="dot${Habits.get(d, `${h}-${s}`) ? " on" : ""}"></i>`).join("")}</span>`;
    const name = i === 0 ? "Auj." : i === 1 ? "Hier" : new Date(d + "T12:00:00").toLocaleDateString("fr-CA", { weekday: "short", day: "numeric" });
    rows.push(`<span class="d${d === day ? " sel" : ""}" data-day="${d}">${name}</span>${dots("bouche")}${dots("perinee")}<span class="dots"><i class="dot${Habits.get(d, "vitd") ? " on" : ""}"></i></span><span>${Habits.get(d, "bain") ? TUB : ""}</span>`);
  }
  $("hist").innerHTML = '<span></span><span class="h">Bouche</span><span class="h">Périnée</span><span class="h">Vit. D</span><span class="h" title="Bain"></span>' + rows.join("");
}

$("grid").addEventListener("click", (e) => {
  const b = e.target.closest(".tick"); if (!b) return;
  buzz(); Habits.set(day, b.dataset.key, b.getAttribute("aria-pressed") !== "true");
});
$("vitd").addEventListener("click", () => { buzz(); Habits.set(day, "vitd", !Habits.get(day, "vitd")); });
$("bath").addEventListener("click", () => { buzz(); Habits.set(day, "bain", !Habits.get(day, "bain")); });
$("prev").addEventListener("click", () => { day = Habits.addDays(day, -1); render(); });
$("next").addEventListener("click", () => { day = Habits.addDays(day, 1); render(); });
$("hist").addEventListener("click", (e) => { const d = e.target.closest("[data-day]"); if (d) { day = d.dataset.day; render(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (day > Habits.today()) day = Habits.today(); render(); } });

// ---------- Reminders: summary here, switch in Settings; keep this phone's subscription up to date ----------
function renderRemind({ on, msg, ask }) {
  $("remindTitle").textContent = on ? "Rappels activés" : "Rappels désactivés";
  $("remindSub").textContent = msg || (ask ? "Touche pour autoriser les notifications sur ce téléphone" : on ? "9 h, 12 h 30 et 17 h 30, s'il reste quelque chose à faire" : "Touche pour les activer");
}
renderRemind(Notifs.state());
Notifs.sync().then(renderRemind);

Habits.onChange(render);
Habits.refresh();
</script>
<script src="app.js"></script>
</body>
</html>
