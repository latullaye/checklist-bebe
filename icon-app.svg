<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Source of the app icon. Rendered to PNG in a browser (needs the Exo 2 Bold font). -->
  <style>
    @font-face { font-family: "Exo 2"; font-weight: 700; src: url(fonts/exo-2-latin-700-normal.woff2) format("woff2"); }
    text { font-family: "Exo 2"; font-weight: 700; text-anchor: middle; }
    .num { font-size: 250px; letter-spacing: -4px; }
    .name { font-size: 100px; letter-spacing: 1px; }
  </style>
  <rect id="bg" width="512" height="512" rx="112" fill="#1f6f78"/>
  <g id="art">
    <!-- THOMAS and 911: same width (textLength), told apart by colour -->
    <g>
      <g fill="#0f4a51" transform="translate(6 6)">
        <text class="name" x="256" y="186" textLength="392" lengthAdjust="spacingAndGlyphs">THOMAS</text>
        <text class="num" x="256" y="374" textLength="408" lengthAdjust="spacingAndGlyphs">911</text>
      </g>
      <text class="name" x="256" y="186" fill="#fff" textLength="392" lengthAdjust="spacingAndGlyphs">THOMAS</text>
      <text class="num" x="256" y="374" fill="#f4b942" textLength="408" lengthAdjust="spacingAndGlyphs">911</text>
    </g>
    <path d="M64 408 H448" stroke="#0f4a51" stroke-width="18" stroke-linecap="round" transform="translate(6 6)"/>
    <path d="M64 408 H448" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
