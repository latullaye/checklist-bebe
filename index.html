<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sortie avec Thomas</title>
<style>
@font-face { font-family: "Bricolage Grotesque"; font-weight: 600; font-display: block; src: url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 800; font-display: block; src: url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2"); }
@font-face { font-family: "Ubuntu"; font-weight: 500; font-display: block; src: url(fonts/ubuntu-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-display: block; src: url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-display: block; src: url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2"); }
html, body { margin: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
/* Layout: one phone screen; only unchecked chips show per category, checked ones drop to a quiet "Vérifié" tray at the bottom */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --ink: #1d2b2a;
  --muted: #5d706d;
  --line: #cfdcd8;
  --group: #e1ebe8;
  --accent: #1f6f78;
  --accent-ink: #ffffff;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a19; --surface: #1a2624; --ink: #e4eeeb; --muted: #93a8a4;
    --line: #2f403d; --group: #162120; --accent: #5fb8bf; --accent-ink: #0c1716;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a19; --surface: #1a2624; --ink: #e4eeeb; --muted: #93a8a4;
  --line: #2f403d; --group: #162120; --accent: #5fb8bf; --accent-ink: #0c1716;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.title img { width: 26px; height: 26px; border-radius: 6px; flex: none; }
h1 { font-family: "Ubuntu", system-ui, sans-serif; font-weight: 500; font-size: 1.1rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.count { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.count b { color: var(--accent); font-weight: 800; font-size: 1.25rem; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
.list { display: flex; flex-direction: column; gap: 12px; }
section { display: flex; flex-direction: column; gap: 6px; }
h2 { margin: 0; display: flex; justify-content: space-between; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
h2 span { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }
.chip {
  font: inherit; font-size: 0.9rem; line-height: 1.2; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 11px 6px 9px; display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent;
}
.chip::before { content: ""; width: 14px; height: 14px; flex: none; border-radius: 50%; border: 1.5px solid var(--line); }
.chip small { color: var(--muted); font-size: 0.75rem; }
.group {
  display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px;
  background: var(--group); border: 1px dashed var(--line); border-radius: 14px; padding: 5px 6px 6px;
}
.group-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 0 4px; width: 100%; }
.chip:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Check feedback: fill + tick pop, then the chip folds away */
.chip {
  position: relative; white-space: nowrap; max-width: 100%; overflow: hidden;
  transition: background .08s, color .08s, border-color .08s, opacity .15s ease, transform .15s ease,
              max-width .17s ease, padding .17s ease, border-width .17s ease;
}
.chip.checking { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: pop .16s ease; }
.chip.checking small { color: var(--accent-ink); opacity: .8; }
.chip.checking::before { background: var(--accent-ink); border-color: var(--accent-ink); }
.chip.checking::after {
  content: ""; position: absolute; left: 14px; top: 50%; width: 4px; height: 8px; margin-top: -6px;
  border: solid var(--accent); border-width: 0 2px 2px 0;
  transform: rotate(45deg) scale(0); animation: tick .1s .02s ease-out forwards;
}
.chip.leaving { opacity: 0; transform: scale(.85); max-width: 0 !important; padding-left: 0; padding-right: 0; border-width: 0; }
.chip.arrive { animation: arrive .4s ease; }
.count b.bump { display: inline-block; animation: bump .2s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes tick { to { transform: rotate(45deg) scale(1); } }
@keyframes arrive {
  0% { opacity: 0; transform: translateY(-4px) scale(.9); background: var(--accent); color: var(--accent-ink); }
  35% { opacity: 1; transform: none; background: var(--accent); color: var(--accent-ink); }
}
@keyframes bump { 40% { transform: scale(1.3); } }
@media (prefers-reduced-motion: reduce) {
  .chip { transition: background .15s, color .15s; }
  .chip.checking, .chip.checking::after, .chip.arrive, .count b.bump { animation: none; }
  .chip.checking::after { transform: rotate(45deg); }
}

.done { border-top: 1px solid var(--line); padding-top: 10px; }
.done h2 { color: var(--accent); }
.done .chip { background: transparent; color: var(--muted); border-color: var(--line); font-size: 0.82rem; padding: 4px 9px 4px 7px; }
.done .chip span { text-decoration: line-through; text-decoration-color: var(--line); }
.done .chip::before { width: 12px; height: 12px; border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 2px var(--bg); }
.done .chip small { display: none; }

.allset { text-align: center; padding: 18px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.allset strong { display: block; font-family: var(--font-display); font-size: 1.3rem; color: var(--accent); }
.allset span { color: var(--muted); font-size: 0.85rem; }

footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 4px; }
.msg { color: var(--muted); font-size: 0.85rem; }
.reset { font: inherit; font-size: 0.85rem; font-weight: 700; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.reset.confirm { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="title">
      <img src="icon-192.png" alt="">
      <h1>Avant de sortir avec Thomas</h1>
    </div>
    <div class="side">
      <div class="count"><b id="done">0</b>/<span id="total">0</span></div>
      <button class="reset" id="reset" type="button">Réinitialiser</button>
    </div>
  </header>
  <div class="bar"><i id="fill"></i></div>
  <div class="list" id="todo"></div>
  <section class="done" id="doneSec" hidden>
    <h2>Vérifié <span id="doneCount"></span></h2>
    <div class="chips" id="doneList"></div>
  </section>
  <footer>
    <span class="msg" id="msg">Touche un élément quand il est dans le sac.</span>
  </footer>
</div>

<script>
// An item is [label, hint] or {group, items:[[label, hint], ...]}
const DATA = [
  ["Repas", [
    ["Biberons de lait maternel", "1 par 3 h"],
    ["Sac isotherme + bloc réfrigérant"],
    ["Formule de secours"],
    ["Tire-lait"],
    ["Linge à rot"],
    ["Bavoir"]
  ]],
  ["Change", [
    { group: "Sac à couches", items: [
      ["Couches", "1 par 2 h + 2"],
      ["Lingettes"],
      ["Crème pour les fesses"]
    ]},
    ["Tapis à langer"],
    ["Sacs pour couches sales"],
    ["Débarbouillettes"],
    ["Désinfectant pour les mains"]
  ]],
  ["Vêtements et confort", [
    ["Rechange complet", "×2"],
    ["Chapeau"],
    ["Lange"],
    ["Suce + attache-suce"],
    ["Couverture ou chaussettes", "selon météo"]
  ]],
  ["Transport", [
    ["Poussette ou porte-bébé"],
    ["Ventilateur", "chargé"]
  ]],
  ["Santé et papiers", [
    ["Carnet de santé"],
    ["Carte d'assurance maladie"]
  ]],
  ["Parents", [
    ["Eau"],
    ["Collations"],
    ["Rechange pour nous"]
  ]]
];

// Flatten into leaf items with stable ids
const leaves = [];
DATA.forEach(([cat, items], ci) => {
  items.forEach((it, ii) => {
    if (Array.isArray(it)) leaves.push({ id: `c${ci}-${ii}`, cat: ci, label: it[0], hint: it[1] });
    else it.items.forEach(([label, hint], si) =>
      leaves.push({ id: `c${ci}-${ii}-${si}`, cat: ci, group: it.group, label, hint }));
  });
});
const total = leaves.length;
document.getElementById("total").textContent = total;

const KEY = "sortie-bebe-v2";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
// Checked chips stay in place while you tap (tap again to undo).
// After IDLE ms without a tap, they all fold away together and move to "Vérifié".
const IDLE = 2000;
const FOLD = reduced ? 0 : 200;
let idleTimer = null, flushing = false;
const pending = new Set();
const arrivals = new Set();

function buzz() { try { if (window.AndroidApp) AndroidApp.vibrate(); else if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }

function armIdle() {
  clearTimeout(idleTimer);
  idleTimer = pending.size ? setTimeout(flush, IDLE) : null;
}

function flush() {
  clearTimeout(idleTimer); idleTimer = null;
  if (flushing) return;
  const els = [...pending].map(id => document.getElementById("t-" + id)).filter(Boolean);
  pending.forEach(id => arrivals.add("d-" + id));
  pending.clear();
  if (!els.length || !FOLD) { render(); return; }
  flushing = true;
  els.forEach(el => { el.style.maxWidth = el.offsetWidth + "px"; });
  void document.body.offsetWidth;
  els.forEach(el => el.classList.add("leaving"));
  setTimeout(() => { flushing = false; render(); }, FOLD);
}

function chip(leaf, prefix) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.id = prefix + leaf.id;
  b.innerHTML = `<span>${leaf.label}</span>` + (leaf.hint ? ` <small>${leaf.hint}</small>` : "");
  b.setAttribute("aria-label", (state[leaf.id] ? "Décocher " : "Cocher ") + leaf.label);
  b.addEventListener("click", () => {
    if (flushing) return;
    buzz();
    if (prefix === "d-") {
      // Uncheck from the tray: bring it back, highlighted where it lands
      delete state[leaf.id]; save();
      arrivals.add("t-" + leaf.id);
      flush();
      return;
    }
    if (pending.has(leaf.id)) {
      // Undo in place, before it has moved
      pending.delete(leaf.id); delete state[leaf.id]; save();
      b.classList.remove("checking");
      updateCounts(false);
    } else {
      pending.add(leaf.id); state[leaf.id] = 1; save();
      b.classList.add("checking");
      updateCounts(true);
    }
    armIdle();
  });
  return b;
}

const todo = document.getElementById("todo");
const doneList = document.getElementById("doneList");

function updateCounts(bump) {
  const done = leaves.filter(l => state[l.id]).length;
  const d = document.getElementById("done");
  d.textContent = done;
  document.getElementById("fill").style.width = (done / total * 100) + "%";
  document.getElementById("msg").textContent = done === total
    ? "Touche un élément vérifié pour le remettre."
    : `Il reste ${total - done} élément${total - done > 1 ? "s" : ""}.`;
  if (bump && !reduced) { d.classList.remove("bump"); void d.offsetWidth; d.classList.add("bump"); }
  return done;
}

function render() {
  clearTimeout(idleTimer); idleTimer = null; pending.clear();
  todo.innerHTML = ""; doneList.innerHTML = "";
  let done = 0;
  DATA.forEach(([cat, items], ci) => {
    const catLeaves = leaves.filter(l => l.cat === ci);
    const open = catLeaves.filter(l => !state[l.id]);
    if (!open.length) return;
    const sec = document.createElement("section");
    const h = document.createElement("h2");
    h.innerHTML = `${cat}<span>${catLeaves.length - open.length}/${catLeaves.length}</span>`;
    const wrap = document.createElement("div"); wrap.className = "chips";
    items.forEach((it, ii) => {
      if (Array.isArray(it)) {
        const leaf = leaves.find(l => l.id === `c${ci}-${ii}`);
        if (!state[leaf.id]) wrap.appendChild(chip(leaf, "t-"));
      } else {
        const sub = leaves.filter(l => l.id.startsWith(`c${ci}-${ii}-`) && !state[l.id]);
        if (!sub.length) return;
        const g = document.createElement("div"); g.className = "group";
        g.innerHTML = `<div class="group-label">${it.group}</div>`;
        sub.forEach(l => g.appendChild(chip(l, "t-")));
        wrap.appendChild(g);
      }
    });
    sec.append(h, wrap);
    todo.appendChild(sec);
  });
  leaves.forEach(l => { if (state[l.id]) { done++; doneList.appendChild(chip(l, "d-")); } });

  if (done === total) {
    todo.innerHTML = `<div class="allset"><strong>Tout est prêt.</strong><span>Bonne sortie avec Thomas !</span></div>`;
  }
  document.getElementById("doneSec").hidden = done === 0;
  document.getElementById("doneCount").textContent = done;
  updateCounts(false);
  arrivals.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add("arrive"); });
  arrivals.clear();
}

const reset = document.getElementById("reset");
let armed = null;
reset.addEventListener("click", () => {
  if (!armed) {
    reset.classList.add("confirm"); reset.textContent = "Confirmer";
    armed = setTimeout(() => { armed = null; reset.classList.remove("confirm"); reset.textContent = "Réinitialiser"; }, 3000);
    return;
  }
  clearTimeout(armed); armed = null;
  state = {}; save();
  reset.classList.remove("confirm"); reset.textContent = "Réinitialiser";
  render();
});

render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
