<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
<title>THOMAS911</title>
<style>
.brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
.brand img { width: 46px; height: 46px; border-radius: 12px; flex: none; }
/* Name as a logo: THOMAS911 in one word, the colour change sets 911 apart */
.brand h1 { font-family: "Exo 2", system-ui, sans-serif; font-weight: 700; font-size: 1.75rem; line-height: 1.05; margin: 0; white-space: nowrap; }
.brand h1 b { color: #d9822b; font-weight: inherit; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
.brand p::first-letter { text-transform: uppercase; }

/* Weather */
.weather { display: block; color: inherit; text-decoration: none; padding: 18px 16px 14px; }
.now { display: flex; align-items: center; gap: 14px; }
.now svg { width: 64px; height: 64px; color: var(--accent); stroke-width: 1.6; flex: none; }
.temp { font-family: var(--font-display); font-weight: 800; font-size: 3.2rem; line-height: 0.9; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.desc { font-weight: 700; margin-top: 6px; }
.sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
.alerts { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.alerts:empty { display: none; }
.alert { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--accent-soft);
  color: var(--accent); font-weight: 700; font-size: 0.88rem; }
.alert svg { width: 18px; height: 18px; flex: none; }
.alert span { font-weight: 400; color: var(--muted); }
.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.day .dn { font-size: 0.75rem; font-weight: 700; color: var(--muted); }
.day svg { width: 26px; height: 26px; color: var(--accent); stroke-width: 1.8; }
.day .hi { font-family: var(--font-display); font-weight: 800; font-size: 1rem; }
.day .lo { font-size: 0.8rem; color: var(--muted); }
.day .pp { font-size: 0.7rem; font-weight: 700; color: var(--accent); min-height: 1em; }
.wx-empty { color: var(--muted); font-size: 0.9rem; }
.wx-empty button { margin-top: 10px; font: inherit; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 10px; padding: 9px 14px; }
.source { margin-top: 10px; font-size: 0.72rem; color: var(--muted); text-align: right; }

/* Big buttons to the tools */
.tile { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; padding: 16px; }
.tile .ico { width: 56px; height: 56px; flex: none; }
.tile .txt { flex: 1; min-width: 0; }
.tile strong { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
.tile .txt span { color: var(--muted); font-size: 0.85rem; }
.tile .go { width: 22px; height: 22px; color: var(--muted); }
.pill { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; color: var(--accent); background: var(--accent-soft);
  border-radius: 999px; padding: 3px 9px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile:active { transform: scale(0.985); }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <img src="icon-192.png" alt="">
    <div>
      <h1 class="logo" aria-label="THOMAS911">THOMAS<b>911</b></h1>
      <p id="today"></p>
    </div>
  </header>

  <a class="card weather" id="wxCard" target="_blank" rel="noopener" aria-live="polite">
    <div class="wx-empty" id="wxEmpty">
      <div class="label">Météo</div>
      <p>Autorise la localisation pour voir la météo ici.</p>
      <button type="button" id="wxAsk">Afficher la météo</button>
    </div>
    <div id="wxBody" hidden>
      <div class="now">
        <span id="wxIcon"></span>
        <div>
          <div class="temp" id="wxTemp"></div>
          <div class="desc" id="wxDesc"></div>
          <div class="sub" id="wxFeels"></div>
          <div class="sub" id="wxSub"></div>
        </div>
      </div>
      <div class="alerts" id="wxAlerts"></div>
      <div class="days" id="wxDays"></div>
      <div class="source">The Weather Channel ›</div>
    </div>
  </a>

  <a class="card tile" href="checklist.html">
    <img class="ico" src="icon-poussette.svg" alt="">
    <span class="txt"><strong>Checklist sortie</strong><span>Avant de partir en poussette</span></span>
    <span class="pill" id="progress" hidden></span>
    <svg class="i go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </a>

  <a class="card tile" href="bruit.html">
    <img class="ico" src="icon-bruit.svg" alt="">
    <span class="txt"><strong>Boîte à bruit</strong><span>Bruit blanc, rose, chut-chut…</span></span>
    <svg class="i go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </a>
</div>

<script src="weather.js"></script>
<script>
const DAYS = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
document.getElementById("today").textContent =
  new Date().toLocaleDateString("fr-CA", { weekday: "long", day: "numeric", month: "long" });

// Checklist progress, saved by the checklist page
try {
  const p = JSON.parse(localStorage.getItem("sortie-bebe-progress"));
  if (p && p.total) {
    const el = document.getElementById("progress");
    el.textContent = p.done >= p.total ? "Prêt !" : `${p.done}/${p.total}`;
    el.hidden = false;
  }
} catch (e) {}

const $ = (id) => document.getElementById(id);
Wx.onUpdate((w) => {
  const [icon, label] = Wx.kind(w.code, w.day);
  const t = Math.round(w.temp);
  $("wxCard").href = Wx.href(w);
  $("wxIcon").innerHTML = Wx.svg(Wx.PATHS[icon]);
  $("wxTemp").textContent = `${t}°`;
  const feels = typeof w.feels === "number" ? Math.round(w.feels) : null;
  $("wxDesc").textContent = label;
  $("wxFeels").textContent = feels !== null && feels !== t ? `Ressenti ${feels}°` : "";
  // Min/max until 18 h; after that, the whole day's
  const range = Wx.range(w);
  const today = w.daily && w.daily.find(([date]) => date === Wx.localNow(w).day);
  $("wxSub").textContent = range ? `↓ ${range[0]}°  ↑ ${range[1]}°  d'ici ${Wx.UNTIL} h`
    : today ? `Aujourd'hui ↓ ${Math.round(today[3])}°  ↑ ${Math.round(today[2])}°` : "";
  $("wxAlerts").innerHTML = Wx.alerts(w).map(([path, text, detail]) =>
    `<div class="alert">${Wx.svg(path)}${text} <span>${detail}</span></div>`).join("");
  // Next 6 days
  const next = (w.daily || []).filter(([date]) => date > Wx.localNow(w).day).slice(0, 6);
  $("wxDays").innerHTML = next.map(([date, code, hi, lo, pp]) => {
    const [ic, lab] = Wx.kind(code);
    const dn = DAYS[new Date(date + "T12:00:00").getDay()];
    return `<div class="day" aria-label="${dn} : ${lab}, ${Math.round(hi)}° / ${Math.round(lo)}°">
      <span class="dn">${dn}</span>${Wx.svg(Wx.PATHS[ic])}<span class="hi">${Math.round(hi)}°</span><span class="lo">${Math.round(lo)}°</span>
      <span class="pp">${pp >= 30 ? pp + " %" : ""}</span></div>`;
  }).join("");
  $("wxDays").hidden = !next.length;
  $("wxEmpty").hidden = true;
  $("wxBody").hidden = false;
});
$("wxAsk").addEventListener("click", (e) => { e.preventDefault(); Wx.refresh(); });
Wx.refresh();
</script>
<script src="app.js"></script>
</body>
</html>
