<title>THOMAS911</title>
<style>
.brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
.brand img { width: 46px; height: 46px; border-radius: 12px; flex: none; }
/* Name as a logo: THOMAS911 in one word, the colour change sets 911 apart */
.brand h1 { font-family: "Exo 2", system-ui, sans-serif; font-weight: 700; font-size: 1.75rem; line-height: 1.05; margin: 0; white-space: nowrap; }
.brand h1 b { color: #d9822b; font-weight: inherit; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
.brand p::first-letter { text-transform: uppercase; }
.brand .sync-slot { margin-left: auto; display: flex; }
.gear { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none;
  color: var(--accent); background: var(--surface); border: 1px solid var(--line); }
.gear svg { width: 22px; height: 22px; }

/* Celebration day banner */
:root { --gold-soft: #fbead2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gold-soft: #3a2e1a; } }
:root[data-theme="dark"] { --gold-soft: #3a2e1a; }
.fete { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; padding: 14px 16px;
  background: linear-gradient(135deg, var(--gold-soft), var(--accent-soft)); border-color: transparent; }
.fete img { width: 46px; height: 46px; flex: none; animation: wiggle 2.4s ease-in-out infinite; }
.fete .txt { flex: 1; min-width: 0; }
.fete b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; line-height: 1.2; }
.fete span { color: var(--muted); font-size: 0.85rem; }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-9deg); } 84% { transform: rotate(8deg); } 92% { transform: rotate(-4deg); } }
@media (prefers-reduced-motion: reduce) { .fete img { animation: none; } }

/* Weather, one line (the full forecast is one tap away) */
.wx { display: block; color: inherit; text-decoration: none; padding: 10px 14px; }
.wx-row { display: flex; align-items: center; gap: 12px; }
.wx-row svg.ic { width: 36px; height: 36px; color: var(--accent); stroke-width: 1.7; flex: none; }
.wx-temp { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.wx-txt { flex: 1; min-width: 0; line-height: 1.25; }
.wx-txt b { display: block; font-size: 0.95rem; }
.wx-txt span { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.wx .go { width: 20px; height: 20px; color: var(--muted); flex: none; }
.alerts { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
.alerts:empty { display: none; }
.alert { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; background: var(--accent-soft);
  color: var(--accent); font-weight: 700; font-size: 0.84rem; }
.alert svg { width: 17px; height: 17px; flex: none; }
.alert span { font-weight: 400; color: var(--muted); }
.wx-empty { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 0.88rem; }
.wx-empty button { font: inherit; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 10px; padding: 8px 12px; flex: none; }

/* Thomas today */
.now { display: flex; flex-direction: column; gap: 0; padding: 0; overflow: hidden; }
.now > * { padding: 10px 14px; }
.now > * + * { border-top: 1px solid var(--line); }
.now a.row { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
.now .row .txt { flex: 1; min-width: 0; }
.now .big { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; line-height: 1.15; }
.now .sub { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 1px; font-variant-numeric: tabular-nums; }
.now .sub b { color: var(--accent); }
.now .pct { font-family: var(--font-display); font-weight: 800; font-size: 0.9rem; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; margin-left: 6px; vertical-align: 2px; }
.now .wrow { display: flex; align-items: center; gap: 12px; }
.now .wrow > a.txt { color: inherit; text-decoration: none; flex: 1; min-width: 0; }
.now .go { width: 20px; height: 20px; color: var(--muted); flex: none; }
.weigh { font: inherit; font-weight: 800; font-size: 0.82rem; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 7px 11px;
  text-decoration: none; display: inline-flex; align-items: center; gap: 4px; flex: none; }
.weigh svg { width: 16px; height: 16px; }
.todo-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.todo-head .label { margin: 0; }
.todo-head a { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-decoration: none; }
.todo { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.todo button { font: inherit; font-size: 0.84rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--accent); border-radius: 999px;
  padding: 6px 10px 6px 7px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: background .15s, color .15s, opacity .3s, transform .3s; }
.todo button::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--accent); flex: none; box-sizing: border-box; }
.todo button small { font-size: 0.75rem; color: var(--muted); margin-left: 2px; }
.todo button.late small { color: #b36b12; font-weight: 700; }
.todo button.done { background: var(--accent); color: var(--accent-ink); }
.todo button.done small { color: var(--accent-ink); }
.todo button.done::before { background: var(--accent-ink); border-color: var(--accent-ink); }
.todo button.gone { opacity: 0; transform: scale(.9); }
.alldone { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }
.alldone b { color: var(--accent); }

/* Screens, by kind of moment: one card per moment, one line per screen (its icon, its name, what's worth knowing on the
   right), lines parted by a thin rule that starts after the icons */
.group { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 2px 2px -6px; }
.list { padding: 0; overflow: hidden; }
.tile { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; padding: 8px 10px 8px 12px; position: relative; transition: background .15s; }
.tile + .tile::before { content: ""; position: absolute; top: 0; left: 54px; right: 0; border-top: 1px solid var(--line); }
.tile .ico { width: 30px; height: 30px; flex: none; }
.tile strong { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 800; font-size: 0.98rem; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .val { max-width: 55%; color: var(--muted); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tile .val b { color: var(--accent); }
.tile .go { width: 18px; height: 18px; color: var(--muted); flex: none; margin-left: -4px; }
.now a.row:active { transform: scale(0.985); }
.tile:active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.now .sub b.late { color: #b36b12; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .now .sub b.late { color: #f0b860; } }
</style>

<script>
const $ = (id) => document.getElementById(id);
const nf = Growth.nf;

// ---------- Thomas today: age and next party, last weight, what's left to tick ----------
function renderAge() {
  if (!Thomas.known) { // the date of birth comes with the family code
    $("ageBig").textContent = "Thomas"; $("ageSub").textContent = "Son âge s'affiche avec le code de la famille"; $("fete").hidden = true; return;
  }
  const a = Thomas.age(), n = Thomas.upcoming(1)[0], inDays = Thomas.daysBetween(Thomas.today(), n.day);
  $("ageBig").textContent = `Thomas a ${a.text.days}`;
  $("ageSub").innerHTML = `<b>${Thomas.short()}</b> · ${n.title} ${inDays === 1 ? "demain" : `dans ${inDays} jours`}`;
  const list = Thomas.on();
  $("fete").hidden = !list.length;
  if (list.length) $("fete").innerHTML = `<img src="icon-age.svg" alt=""><span class="txt"><b>Aujourd'hui, Thomas a ${list.map((m) => m.title).join(" et ")} !</b>
    <span>Touche pour célébrer</span></span><svg class="i go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>`;
}
function renderWeight() {
  const pts = Growth.weights(Growth.rows()), last = pts.at(-1);
  if (!last) return;
  // The trend over about a week (several weighings), else the gain since the weighing before
  const t = Growth.headline(Growth.trends(pts)), g = t ? { g: t.g, days: t.nominal ? t.days : t.span } : Growth.gainOf(pts, pts.length - 1);
  $("wBig").innerHTML = `${nf(last.v, 3)} kg${last.z == null ? "" : `<span class="pct">${Growth.pctText(last.z)}</span>`}`;
  $("wSub").innerHTML = (g ? `<b>${g.g >= 0 ? "+" : "−"}${nf(Math.abs(g.g))} g/j</b> sur ${Math.max(1, Math.round(g.days))} j · ` : "")
    + Thomas.fmtDay(last.day, { day: "numeric", month: "short" }) + (last.row._pending ? " · à envoyer" : "");
}
Growth.onChange(renderWeight);

// Habits of the moment (this slot) and the vitamin D, checkable right here
const NAMES = { bouche: "Bouche", perinee: "Rééducation", vitd: "Vitamine D", bain: "Bain" };
const MOMENT = { matin: "ce matin", midi: "ce midi", soir: "ce soir" };
function todoLabel(k) {
  if (k !== "bain") return NAMES[k.split("-")[0]];
  // It only shows on bath night: how long since the last one only when it's late (3 days and more, in orange)
  const d = Habits.bathAgo();
  return d >= 3 ? `Bain<small>${d} j</small>` : "Bain";
}
function renderTodo() {
  const day = Habits.today(), slot = Habits.slotNow(), { done, total } = Habits.progress();
  const left = Habits.left();
  $("todoTitle").textContent = `À faire ${MOMENT[slot]}`;
  $("todoCount").textContent = `${done}/${total} aujourd'hui ›`;
  $("habSub").innerHTML = done >= total ? "<b>Fait</b>" : `<b>${done}/${total}</b>`;
  $("todo").innerHTML = left.map((k) => `<button type="button" data-k="${k}"${k === "bain" && Habits.bathAgo() >= 3 ? ' class="late"' : ""}>${todoLabel(k)}</button>`).join("");
  $("allDone").hidden = !!left.length;
  $("allDone").innerHTML = `<b>Tout est fait ${MOMENT[slot]}.</b> Bravo !`;
}
$("todo").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]"); if (!b || b.classList.contains("done")) return;
  window.buzz && buzz();
  b.classList.add("done");
  setTimeout(() => b.classList.add("gone"), 350);
  setTimeout(() => Habits.set(Habits.today(), b.dataset.k, true), 650); // re-renders without it
});
Habits.onChange(renderTodo);

// Health (sante.js): what's going on, the next doses, an appointment soon
function renderHealth() {
  const now = Date.now(), open = Sante.openProblems(), meds = Sante.meds().filter((m) => Sante.isActive(m));
  const soon = Sante.upcoming(now).filter((r) => Date.parse(r.le) < now + 2 * Sante.DAY);
  const at = (t, tz) => { const day = Sante.dayOf(t, tz), rel = Sante.relDay(day); return `${rel === "aujourd'hui" ? "" : `${rel} `}${Sante.fmtTime(t, tz)}`; };
  // The doses due go together ("Doliprane, Tiorfan à donner"), then the next one; medications by their short name
  const next2 = meds.map((m) => [m, Sante.nextDose(m, now)]).filter(([, n]) => n).sort((a, b) => a[1].at - b[1].at);
  const due = next2.filter(([, n]) => n.kind === "due" && n.at <= now).map(([m]) => esc(Sante.shortName(m.nom)));
  const doses = [...(due.length ? [`<b class="late">${due.join(", ")} à donner</b>`] : []),
    ...next2.filter(([, n]) => !(n.kind === "due" && n.at <= now)).slice(0, due.length ? 1 : 2)
      .map(([m, n]) => `${esc(Sante.shortName(m.nom))} ${n.kind === "possible" ? (n.at <= now ? "possible" : `dès ${at(n.at, m.fuseau)}`) : `à ${at(n.at, m.fuseau)}`}`)];
  const rdv = soon.map((r) => `${Sante.rdvTitle(r)} ${at(Date.parse(r.le), r.fuseau)}`).map(esc).slice(0, 1);
  $("hRow").hidden = !open.length && !meds.length && !soon.length;
  if (!$("hRow").hidden) {
    const p = open[0];
    $("hBig").textContent = p ? `${Sante.nameOf(p)} · jour ${Sante.dayNumber(p)}` : meds.length ? Sante.shortName(meds[0].nom) : "Rendez-vous";
    const last = p && Sante.notesOf(p.id).at(-1);
    $("hSub").innerHTML = [...doses, ...rdv].join(" · ") || (last ? `Noté ${at(Date.parse(last.le), last.fuseau)}` : "Rien noté encore");
    $("hNote").hidden = !p;
    $("hNote").href = p ? `sante.html#noter/${p.id}` : "sante.html#noter";
  }
  const next = Sante.upcoming(now)[0];
  $("santeSub").innerHTML = open.length ? `<b>${esc(open.map((p) => Sante.nameOf(p)).join(", "))}</b>`
    : next ? `Rendez-vous ${Sante.fmtDay(Sante.dayOf(next.le, next.fuseau), { weekday: undefined })}` : "";
}
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
Sante.onChange(renderHealth);

// Other screens' state, kept on this phone
const SOUND_NAMES = { blanc: "Bruit blanc", rose: "Bruit rose", brun: "Bruit brun", chut: "Chut-chut", coeur: "Battements de cœur", ventre: "Ventre de maman",
  pluie: "Pluie", vagues: "Vagues", seche: "Sèche-cheveux", ventilo: "Ventilateur", aspi: "Aspirateur" };
function renderLocal() {
  try {
    const p = JSON.parse(localStorage.getItem("sortie-bebe-progress"));
    if (p && p.total) $("checkSub").innerHTML = p.done >= p.total ? "<b>Prêt</b>" : `<b>${p.done}/${p.total}</b>`;
  } catch (e) {}
  try { const s = JSON.parse(localStorage.getItem("thomas911-bruit")); if (s && SOUND_NAMES[s.sound]) $("noiseSub").textContent = SOUND_NAMES[s.sound]; } catch (e) {}
}

function renderAll() {
  $("today").textContent = new Date().toLocaleDateString("fr-CA", { weekday: "long", day: "numeric", month: "long" });
  renderAge(); renderWeight(); renderTodo(); renderHealth(); renderLocal();
}
renderAll();
Habits.refresh();
Growth.load();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { renderAll(); Growth.load(); } });

// ---------- Weather, one line ----------
Wx.onUpdate((w) => {
  const [icon, label] = Wx.kind(w.code, w.day);
  const t = Math.round(w.temp), feels = typeof w.feels === "number" ? Math.round(w.feels) : null;
  $("wxIcon").innerHTML = Wx.svg(Wx.PATHS[icon]).replace("<svg", '<svg class="ic"');
  $("wxTemp").textContent = `${t}°`;
  $("wxDesc").textContent = label + (feels !== null && feels !== t ? ` · ressenti ${feels}°` : "");
  const range = Wx.range(w);
  const today = w.daily && w.daily.find(([date]) => date === Wx.localNow(w).day);
  $("wxSub").textContent = range ? `↓ ${range[0]}°  ↑ ${range[1]}° d'ici ${Wx.UNTIL} h`
    : today ? `Aujourd'hui ↓ ${Math.round(today[3])}°  ↑ ${Math.round(today[2])}°` : "Prévisions sur 10 jours";
  $("wxAlerts").innerHTML = Wx.alerts(w).map(([path, text, detail]) =>
    `<div class="alert">${Wx.svg(path)}${text} <span>${detail}</span></div>`).join("");
  $("wxEmpty").hidden = true;
  $("wxBody").hidden = false;
});
$("wxAsk").addEventListener("click", (e) => { e.preventDefault(); Wx.refresh(); });
Wx.refresh();
</script>
