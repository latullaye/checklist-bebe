<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Data only goes to the family's Supabase project and the weather service; no page address leaks to the sites it links to;
     search engines are asked not to index the app -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://vvkkxphkyjejyhbcdcuw.supabase.co https://api.open-meteo.com; media-src 'self' blob: data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="common.css">
<title>Croissance · THOMAS911</title>
<style>
/* Tabs */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--group); }
.tab { font: inherit; font-weight: 700; font-size: 0.92rem; color: var(--muted); background: none; border: 0; border-radius: 10px; padding: 7px 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* Summary */
.sum { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.sum .val { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.sum .val small { font-size: 1rem; margin-left: 4px; }
.sum .pct { text-align: right; }
.sum .pct b { display: inline-block; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 12px; }
.sum .pct span { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.sub { margin-top: 6px; font-size: 0.84rem; color: var(--muted); line-height: 1.4; }
.sub b { color: var(--ink); }
.nw { white-space: nowrap; }
.empty { color: var(--muted); font-size: 0.9rem; }

/* Milk per day */
.milk { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.mcol { background: var(--bg); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.mcol span { display: block; font-size: 0.78rem; color: var(--muted); font-weight: 700; }
.mcol b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1.1; margin-top: 2px; font-variant-numeric: tabular-nums; }
.mcol b small { font-size: 0.9rem; margin-left: 3px; }
.mcol em { display: block; font-style: normal; font-size: 0.78rem; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.mcol.tgt { background: var(--accent-soft); }
.mcol.tgt b { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.chips .lab { font-size: 0.8rem; color: var(--muted); font-weight: 700; margin-right: 2px; }
.chip { font: inherit; font-size: 0.82rem; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 11px; cursor: pointer; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.feeds { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.88rem; line-height: 1.35; font-variant-numeric: tabular-nums; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.step button { font: inherit; font-weight: 800; font-size: 1rem; width: 34px; height: 32px; border: 0; background: var(--bg); color: var(--accent); cursor: pointer; }
.step b { min-width: 26px; text-align: center; }

/* Chart */
.chart { position: relative; margin: 6px -6px 0; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.chart .grid, .fs-chart .grid { stroke: var(--line); stroke-width: 1; }
/* Axis numbers and curve names follow the theme (they were left black in dark mode) */
.chart text.axis, .chart .curve-label, .fs-chart text.axis, .fs-chart .curve-label { fill: var(--muted); font-size: 12px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.fs-chart text.axis { font-size: 13px; }
.chart .axis-title, .fs-chart .axis-title { fill: var(--muted); font-size: 11px; font-weight: 700; }
.chart .band, .fs-chart .band { fill: var(--muted); opacity: .09; }
.chart .p50, .fs-chart .p50 { stroke: var(--ink); stroke-width: 2; fill: none; opacity: .7; }
.chart .p15, .fs-chart .p15 { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
.chart .p3, .fs-chart .p3 { stroke: var(--muted); stroke-width: 1.2; fill: none; stroke-dasharray: 1.5 3; stroke-linecap: round; }
.chart .curve-label.p50l, .fs-chart .curve-label.p50l { fill: var(--ink); font-weight: 700; }
.chart .line, .fs-chart .line { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt, .fs-chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 1.8; }
.chart .pt.last, .fs-chart .pt.last { fill: var(--accent); }
.chart .sel, .fs-chart .sel { fill: none; stroke: var(--ink); stroke-width: 1.5; opacity: .8; }
.chart .pt.on, .fs-chart .pt.on { fill: var(--ink); stroke: var(--ink); }
.chart .guide, .fs-chart .guide { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; opacity: .45; }
.chart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.expand { font: inherit; font-size: 0.8rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px;
  padding: 6px 11px 6px 9px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.expand svg { width: 16px; height: 16px; }
.head-btns { display: flex; gap: 6px; flex: none; }
/* Image export */
.exp .preview { display: block; width: 100%; max-height: 58vh; object-fit: contain; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.exp .msg { color: var(--muted); font-size: 0.85rem; margin: 0; }

/* Full screen chart: pinch to zoom on time; portrait, landscape, or turned by CSS when the phone can't */
.fs { position: fixed; inset: 0; z-index: 50; background: var(--surface); overflow: hidden; }
.fs-in { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px;
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.fs-in.rot { transform-origin: 0 0; padding: 10px 14px 8px; }
.fs-top { display: flex; align-items: center; gap: 6px; }
.fs-top .seg { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--group); margin-right: auto; }
.fs-top .seg button { font: inherit; font-weight: 700; font-size: 0.82rem; color: var(--muted); background: none; border: 0; border-radius: 9px; padding: 6px 9px; cursor: pointer; }
.fs-top .seg button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.fs-btn { font: inherit; font-size: 0.82rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px;
  height: 34px; padding: 0 11px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; flex: none; }
.fs-btn svg { width: 17px; height: 17px; }
.fs-btn.x { width: 34px; padding: 0; justify-content: center; color: var(--ink); background: var(--group); }
.fs-chart { flex: 1; min-height: 0; position: relative; touch-action: none; -webkit-user-select: none; user-select: none; }
.fs-chart svg { display: block; position: absolute; left: 0; top: 0; }
.fs-tip { font-size: 0.84rem; line-height: 1.3; font-variant-numeric: tabular-nums; min-height: 1.3em; }
.fs-hint { font-size: 0.72rem; color: var(--muted); }
/* Narrow screens: icons only, "Tout voir" first */
@media (max-width: 480px) { #fsAll .lbl { display: none; } #fsAll { width: 34px; padding: 0; justify-content: center; } }
@media (max-width: 360px) { .fs-btn .lbl { display: none; } .fs-btn { width: 34px; padding: 0; justify-content: center; } }

.tip { min-height: 2.6em; margin-top: 6px; font-size: 0.86rem; line-height: 1.35; font-variant-numeric: tabular-nums; }
.tip b { font-weight: 700; }
.src { font-size: 0.72rem; color: var(--muted); margin: 6px 0 0; }

/* Add button */
.add { font: inherit; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: var(--accent-ink); background: var(--accent); border: 0;
  border-radius: 14px; padding: 11px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.add svg { width: 22px; height: 22px; }

/* Table */
table.m { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.82rem; font-variant-numeric: tabular-nums; }
table.m th { text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 0 4px 6px 0; font-weight: 700; }
table.m td { padding: 7px 4px 7px 0; border-top: 1px solid var(--line); white-space: nowrap; }
table.m tr.r { cursor: pointer; }
table.m tr.latest td { color: var(--accent); font-weight: 700; }
table.m td.neg { color: #c4553f; }
table.m td small.wait { color: #b36b12; font-weight: 700; }
table.m td small { display: block; font-size: 0.7rem; color: var(--muted); font-weight: 400; margin-top: 1px; }
/* Usual gain for the age: green = P15–P85, amber = P5–P15 and P85–P95, the mark = his gain */
.gauge { position: relative; display: block; width: 46px; height: 6px; border-radius: 3px; margin-top: 5px;
  background: linear-gradient(90deg, rgba(196,85,63,.35) 0 17.1%, rgba(224,160,64,.5) 17.1% 29.3%, rgba(63,174,106,.6) 29.3% 70.7%, rgba(224,160,64,.5) 70.7% 82.9%, rgba(196,85,63,.35) 82.9%); }
.gauge i { position: absolute; top: -3px; width: 3px; height: 12px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 1.5px var(--surface); }
.gauge.faint { opacity: .45; }
table.m td small.early { font-size: 0.66rem; }
.vel { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.vel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.84rem; color: var(--muted); }
.vel-head b { color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.vel .gauge { width: 100%; height: 9px; border-radius: 5px; margin-top: 12px; }
.vel .gauge i { top: -4px; width: 4px; height: 17px; margin-left: -2px; }
.vel-scale { position: relative; height: 15px; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.vel-scale span { position: absolute; top: 2px; transform: translateX(-50%); }
.vel-say { margin: 4px 0 0; font-size: 0.86rem; font-weight: 700; }
.vel-say.ok { color: #2f8f55; } .vel-say.near { color: #b36b12; } .vel-say.out { color: #c4553f; }
.legend { font-size: 0.72rem; color: var(--muted); margin: 8px 0 0; line-height: 1.4; display: flex; align-items: center; gap: 8px; }
.legend .gauge { flex: none; margin: 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .vel-say.ok { color: #6fd39a; } :root:not([data-theme="light"]) .vel-say.near { color: #f0b860; } :root:not([data-theme="light"]) .vel-say.out { color: #f08a75; } }
/* Trend of the weight gain */
.vel.first { margin-top: 4px; padding-top: 0; border-top: 0; }
table.t td small { display: inline; margin-left: 4px; }
table.t td small.real { display: block; margin: 1px 0 0; }
.how { font-size: 0.74rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }
.how summary { font-weight: 700; color: var(--accent); cursor: pointer; font-size: 0.8rem; }
.how p { margin: 6px 0 0; }
#scaleChips { margin: 6px 0 4px; }
table.m td.note { white-space: normal; color: var(--muted); font-size: 0.74rem; padding-top: 0; border-top: 0; }

/* Entry sheet */
dialog { border: 0; border-radius: 22px; padding: 0; width: min(420px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.sheet { padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin: 0; }
.field label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.field input { font: inherit; width: 100%; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.field input:focus { outline: none; border-color: var(--accent); }
.weight { display: flex; align-items: baseline; gap: 8px; }
.weight input { font-family: var(--font-display); font-weight: 800; font-size: 2rem; padding: 8px 12px; text-align: center; font-variant-numeric: tabular-nums; }
.weight span { font-weight: 700; color: var(--muted); }
.read { font-size: 0.85rem; color: var(--muted); margin-top: 5px; min-height: 1.2em; }
.read b { color: var(--accent); }
.read.bad b { color: #c4553f; }
.nudge { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.nudge button { font: inherit; font-weight: 700; font-size: 0.85rem; color: var(--accent); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; cursor: pointer; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toggle { font: inherit; font-size: 0.88rem; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.actions { display: flex; gap: 8px; margin-top: 4px; }
.actions button { font: inherit; font-weight: 700; border-radius: 12px; padding: 12px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.actions .save { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.actions .del { color: #c4553f; }
.err { color: #c4553f; font-size: 0.85rem; min-height: 1em; margin: 0; }
/* Where it was taken */
.lieux { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--group); }
.lieux button { font: inherit; font-weight: 700; font-size: 0.9rem; color: var(--muted); background: none; border: 0; border-radius: 9px; padding: 9px 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.lieux button[aria-checked="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="./" aria-label="Retour à l'accueil"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <h1>Croissance</h1>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-k="poids" type="button">Poids</button>
    <button class="tab" role="tab" data-k="taille" type="button">Taille</button>
    <button class="tab" role="tab" data-k="pc" type="button">Tête</button>
  </div>

  <section class="card" id="sumCard"></section>

  <section class="card" id="trendCard" hidden>
    <div class="label">Gain de poids par 24 h</div>
    <div class="chips" id="scaleChips" hidden></div>
    <div id="trend"></div>
  </section>

  <section class="card">
    <div class="chart-head"><div class="label" id="chartTitle"></div>
      <span class="head-btns">
        <button class="expand" id="exportBtn" type="button" aria-label="Exporter en image"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Image</button>
        <button class="expand" id="fsOpen" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>Plein écran</button>
      </span></div>
    <div class="chart" id="chart"></div>
    <div class="tip" id="tip"></div>
    <p class="src">OMS 2006, garçons · bande grise : P15 à P85.</p>
  </section>

  <button class="add" id="add" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nouvelle mesure</button>

  <section class="card">
    <div class="label">Mesures</div>
    <div id="table"></div>
    <p class="err" id="err2"></p>
  </section>

  <section class="card" id="milkCard" hidden>
    <div class="label">Lait par jour</div>
    <div class="milk">
      <div class="mcol"><span>Selon son poids</span><b id="mNow"></b><em id="mNowW"></em></div>
      <div class="mcol tgt"><span>Selon le poids cible</span><b id="mTgt"></b><em id="mTgtW"></em></div>
    </div>
    <div class="chips" id="tgtChips"></div>
    <div class="feeds"><span class="step"><button type="button" id="feedMinus" data-buzz aria-label="Un boire de moins">−</button><b id="nFeeds"></b><button type="button" id="feedPlus" data-buzz aria-label="Un boire de plus">+</button></span><span id="perFeed"></span></div>
    <details class="how"><summary>Repères</summary><p id="milkNote"></p></details>
  </section>
</div>

<div class="fs" id="fs" hidden>
  <div class="fs-in" id="fsIn">
    <div class="fs-top">
      <div class="seg" role="tablist"><button type="button" data-k="poids">Poids</button><button type="button" data-k="taille">Taille</button><button type="button" data-k="pc">Tête</button></div>
      <button class="fs-btn" id="fsAll" type="button" title="Tout voir" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span class="lbl">Tout voir</span></button>
      <button class="fs-btn" id="fsRot" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M8 3.5a7 7 0 0 1 8 0M14.5 2l1.6 1.6-1.6 1.6"/></svg><span class="lbl" id="fsRotLbl">Paysage</span></button>
      <button class="fs-btn x" id="fsClose" type="button" aria-label="Fermer le plein écran"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="fs-chart" id="fsChart"></div>
    <div class="fs-tip" id="fsTip"></div>
    <div class="fs-hint">Pince pour zoomer sur le temps · glisse pour te déplacer · touche un point · double-tape pour tout voir</div>
  </div>
</div>

<dialog id="exp" class="exp">
  <div class="sheet">
    <h2>Image des courbes</h2>
    <p class="msg" id="expMsg"></p>
    <img class="preview" id="expImg" alt="Aperçu : tendance du gain, courbes de poids, taille et périmètre crânien, et tableau des mesures">
    <div class="actions">
      <button type="button" id="expClose">Fermer</button>
      <button type="button" id="expSave">Enregistrer</button>
      <button type="button" class="save" id="expShare" hidden>Partager</button>
    </div>
  </div>
</dialog>

<dialog id="dlg">
  <form class="sheet" id="form" method="dialog">
    <h2 id="dlgTitle">Nouvelle mesure</h2>
    <div class="two">
      <div class="field"><label for="fDate">Date</label><input type="date" id="fDate" required></div>
      <div class="field"><label for="fHeure">Heure</label><input type="time" id="fHeure" required></div>
    </div>
    <p class="read" id="tzNote" hidden></p>
    <div class="field"><label id="lieuLab">Lieu</label>
      <div class="lieux" id="fLieu" role="radiogroup" aria-labelledby="lieuLab"><button type="button" role="radio" data-buzz data-l="clsc">CLSC</button><button type="button" role="radio" data-buzz data-l="medecin">Médecin</button><button type="button" role="radio" data-buzz data-l="maison">Maison</button></div>
    </div>
    <div class="field">
      <label for="fPoids">Poids</label>
      <div class="weight"><input id="fPoids" inputmode="decimal" autocomplete="off" placeholder="5850"><span>g</span></div>
      <div class="read" id="readPoids"></div>
      <div class="nudge"><button type="button" data-buzz data-g="-10">−10 g</button><button type="button" data-buzz data-g="-1">−1 g</button><button type="button" data-buzz data-g="1">+1 g</button><button type="button" data-buzz data-g="10">+10 g</button></div>
    </div>
    <button class="toggle" type="button" id="more">+ Taille et périmètre crânien</button>
    <div class="two" id="moreFields" hidden>
      <div class="field"><label for="fTaille">Taille (cm)</label><input id="fTaille" inputmode="decimal" autocomplete="off" placeholder="63,0"></div>
      <div class="field"><label for="fPc">Périm. crânien (cm)</label><input id="fPc" inputmode="decimal" autocomplete="off" placeholder="40,0"></div>
    </div>
    <div class="field"><label for="fNote">Note (facultatif)</label><input id="fNote" autocomplete="off" placeholder="Avant le boire, sans couche…"></div>
    <p class="err" id="err"></p>
    <div class="actions">
      <button type="button" class="del" id="del" hidden>Supprimer</button>
      <button type="button" id="cancel">Annuler</button>
      <button type="submit" class="save" id="save">Enregistrer</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="famille.js"></script>
<script src="sync.js"></script>
<script src="prefs.js"></script>
<script src="who-boys.js"></script>
<script src="thomas.js"></script>
<script src="growth.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const nf = (n, d = 0) => n.toLocaleString("fr-CA", { minimumFractionDigits: d, maximumFractionDigits: d });
const sign = (n, d = 2) => (n >= 0 ? "+" : "−") + nf(Math.abs(n), d);

// ---------- WHO percentiles (growth.js) ----------
const { lms, atZ, zScore, pctText, CURVES, DAY_MS, gainOf } = Growth;

// ---------- The three views ----------
const KINDS = {
  poids: { table: "wfa", field: "poids_g", title: "Poids selon l'âge", axis: "Poids (kg)", unit: "kg", dec: 3, scale: 1000, what: "pesée" },
  taille: { table: "lhfa", field: "taille_cm", title: "Taille selon l'âge", axis: "Taille (cm)", unit: "cm", dec: 1, scale: 1, what: "mesure de taille" },
  pc: { table: "hcfa", field: "pc_cm", title: "Périmètre crânien selon l'âge", axis: "Périmètre crânien (cm)", unit: "cm", dec: 1, scale: 1, what: "mesure du périmètre crânien" }
};
let kind = "poids";
try { const k = localStorage.getItem("thomas911-croissance-onglet"); if (KINDS[k]) kind = k; } catch (e) {}

// ---------- Data: the shared table "mesures" (growth.js: cache, and an outbox for what is saved offline) ----------
let rows = Growth.rows();
Growth.onChange(() => { rows = Growth.rows(); render(); });
const load = () => Growth.load();

// ---------- Time of each measure ----------
// pese_le is the exact instant; fuseau the phone's time zone when it was taken, so 12 h 44 at home stays 12 h 44
const HERE = Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Paris";
function partsIn(t, tz) { // instant -> { day: "YYYY-MM-DD", time: "HH:MM" } on the wall clock of tz
  const f = new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const p = Object.fromEntries(f.formatToParts(new Date(t)).map((x) => [x.type, x.value]));
  return { day: `${p.year}-${p.month}-${p.day}`, time: `${p.hour}:${p.minute}` };
}
function instant(day, time, tz) { // wall clock in tz -> Date
  const wall = Date.parse(`${day}T${time}:00Z`);
  const offset = (t) => { const p = partsIn(t, tz); return Date.parse(`${p.day}T${p.time}:00Z`) - t; };
  let t = wall - offset(wall);
  t = wall - offset(t); // second pass, right around a daylight-saving change
  return new Date(t);
}
// The family's town comes with the shared settings (famille.js), not from this public code
const HOME = (window.Famille && Famille.info().ville) || "l'Est";
const CITY = { "America/Toronto": HOME, "America/Montreal": HOME, "Europe/Paris": "France" };
const tzName = (tz) => CITY[tz] || (tz || "").split("/").pop().replace(/_/g, " ");
const tsOf = Growth.tsOf;
const fmtTime = (t, tz) => new Date(t).toLocaleTimeString("fr-CA", { hour: "numeric", minute: "2-digit", timeZone: tz || HERE });

// Points for a view: [{ row, day, age (whole days), ageF (days to the minute), t, v (display unit), z }]
function points(k = kind) {
  const K = KINDS[k];
  return rows.filter((r) => r[K.field] != null).map((r) => {
    // Percentiles use the age in days like the WHO tools (date of the measure minus date of birth);
    // the exact time places the point on the chart and gives the gain per day
    const t = tsOf(r), age = Thomas.known ? Thomas.daysBetween(Thomas.BIRTH_DAY, r.jour) : null, v = Number(r[K.field]) / K.scale;
    return { row: r, day: r.jour, t, age, ageF: Thomas.known ? (t - Thomas.BIRTH) / DAY_MS : null, v, z: age == null ? null : zScore(K.table, age, v) };
  }).sort((a, b) => a.t - b.t);
}
const MIN_GAP = Growth.MIN_GAP;
// Where a gain stands against the usual gain for the age (growth.js, WHO 2009 velocity standards)
const velOf = (g) => g && Growth.velocity(g.from.ageF, g.from.ageF + g.days, g.g);
const gaugeAt = (z) => (Math.max(-2.5, Math.min(2.5, z)) + 2.5) / 5 * 100;
const gauge = (v, cls = "") => `<span class="gauge${v.short ? " faint" : ""}${cls}" title="Habituel à cet âge : ${nf(v.lo)} à ${nf(v.hi)} g/j"><i style="left:${gaugeAt(v.z).toFixed(1)}%"></i></span>`;
const usual = (v) => `${nf(Math.max(0, v.lo))} à ${nf(v.hi)} g/j`;
// "7 j 23 h", "21 h", "31 j"
const span = (d) => { const h = Math.round(d * 24); return h < 24 ? `${h} h` : h % 24 && d < 14 ? `${Math.floor(h / 24)} j ${h % 24} h` : `${Math.round(d)} j`; };
const fmtV = (v, k = kind) => `${nf(v, KINDS[k].dec)} ${KINDS[k].unit}`;
const fmtDate = (day, year) => Thomas.fmtDay(day, { day: "numeric", month: "short", ...(year ? { year: "numeric" } : {}) });
const when = (p, year) => `${fmtDate(p.day, year)} à ${fmtTime(p.t, p.row.fuseau)}${p.row.fuseau && p.row.fuseau !== HERE ? ` (heure de ${tzName(p.row.fuseau)})` : ""}`;
// Weight-for-length percentile when weight and length were taken the same day
function wfl(r) {
  if (r.poids_g == null || r.taille_cm == null) return null;
  const z = zScore("wfl", Math.round(Number(r.taille_cm) * 10) / 10, r.poids_g / 1000);
  return z == null ? null : pctText(z);
}

// ---------- Summary ----------
function renderSummary() {
  const K = KINDS[kind], pts = points();
  if (!pts.length) { $("sumCard").innerHTML = `<p class="empty">Aucune ${K.what} pour l'instant. Touche « Nouvelle mesure ».</p>`; return; }
  const last = pts.at(-1);
  const nb = (t) => `<span class="nw">${t}</span>`; // keep "12 sem 4 j" or "+36 g/j" on one line
  const where = last.row.lieu ? ` · ${Growth.lieuName(last.row.lieu)}` : "";
  let sub = `<b>${nb(when(last))}</b>${where} · ${nb(Thomas.short(last.day))}`;
  const gain = kind === "poids" && gainOf(pts, pts.length - 1);
  // Since the weighing before (the trend over several days is in the card below)
  if (gain) sub += `<br><b>${nb(`${sign(gain.g, 0)} g/j`)}</b> sur ${nb(span(gain.days))} depuis le ${nb(fmtDate(gain.from.day))}`;
  if (kind === "taille" && wfl(last.row)) sub += `<br>Poids-pour-taille : <b>${wfl(last.row)}</b>`;
  $("sumCard").innerHTML = `<div class="sum"><div class="val">${nf(last.v, K.dec)}<small>${K.unit}</small></div>
    <div class="pct"><b>${last.z == null ? "—" : pctText(last.z)}</b><span>${last.z == null ? "" : `score-z ${sign(last.z)}`}</span></div></div>
    <div class="sub">${sub}</div>`;
}

// ---------- Trend: average gain per 24 h over 3, 5, 7, 10, 14 and 30 days (growth.js) ----------
// The scales of the CLSC, the doctor and home differ a little: the trend can use one of them only.
const SCALE_KEY = "thomas911-balance";
let scale = ""; try { scale = localStorage.getItem(SCALE_KEY) || ""; } catch (e) {}
// A scale can be picked once it has at least two weighings, and there are two kinds of scale
const scales = (all) => { const n = (k) => all.filter((p) => p.row.lieu === k).length, known = Growth.LIEUX.filter(([k]) => n(k));
  return known.length < 2 ? [] : known.filter(([k]) => n(k) >= 2); };
const scalePts = (all) => scale ? all.filter((p) => p.row.lieu === scale) : all;
const range = (v) => `${nf(Math.max(0, v.lo))} à ${nf(v.hi)}`;
// "7 jours"; when the weighings cover quite another span (none near the start), the real one too
const offSpan = (t) => !t.nominal;
const period = (t) => `${t.days} jours` + (offSpan(t) ? ` (en fait ${Math.round(t.span)} j)` : "");
const TREND_HOW = "Pour chaque période qui se termine à la dernière pesée : pente de la droite qui passe au plus près de toutes ses pesées "
  + "(à la minute près), ramenée à 24 h. Une pesée un peu haute ou basse (boire, couche) y compte moins que dans un simple écart entre deux pesées.";
const TREND_WHO = "Habituel : gain de 70 % des garçons de cet âge (OMS 2009, P15 à P85), repère calculé sur un mois : sur 3 à 5 jours, les écarts sont fréquents.";
const TREND_MIX = "* Balances différentes : moins fiable sur peu de jours.";
const TREND_HOME = "À la maison, pour une tendance fiable : même balance, même moment (par exemple avant le boire du matin), même tenue.";
function renderTrend() {
  const all = points("poids");
  $("trendCard").hidden = kind !== "poids" || all.length < 2;
  if ($("trendCard").hidden) return;
  const pick = scales(all);
  if (!pick.some(([k]) => k === scale)) scale = "";
  $("scaleChips").hidden = !pick.length;
  $("scaleChips").innerHTML = `<span class="lab">Balance :</span>` + [["", "Toutes"], ...pick].map(([k, name]) =>
    `<button type="button" class="chip" data-buzz data-s="${k}" aria-pressed="${k === scale}">${name}</button>`).join("");
  const list = Growth.trends(scalePts(all)), head = Growth.headline(list);
  if (!head) {
    $("trend").innerHTML = `<p class="empty">Pas encore assez de pesées${scale ? ` ${Growth.lieuName(scale, true)}` : ""} pour une tendance : il en faut au moins deux, à un jour d'écart ou plus.</p>`;
    return;
  }
  const v = head.vel;
  let html = `<div class="vel first"><div class="vel-head"><span>Sur ${period(head)} · ${head.n} pesées</span><b>${sign(head.g, 0)} g/j</b></div>`
    + (v ? `${gauge(v)}<div class="vel-scale"><span style="left:29.3%">${nf(Math.max(0, v.lo))}</span><span style="left:70.7%">${nf(v.hi)}</span></div>
      <p class="vel-say ${Growth.velLevel(v.z)}">${Growth.velWords(v.z).replace(/^./, (c) => c.toUpperCase())} (${range(v)} g/j à cet âge)</p>` : "") + "</div>";
  html += `<table class="m t"><tr><th>Sur</th><th>Depuis le</th><th>Pesées</th><th>g/jour</th></tr>`
    + list.map((t) => `<tr${t === head ? ' class="latest"' : ""}><td>${t.days} j${t.mixed ? "*" : ""}${offSpan(t) ? `<small class="real">en fait ${Math.round(t.span)} j</small>` : ""}</td><td>${fmtDate(t.from.day)}<small>${fmtTime(t.from.t, t.from.row.fuseau)}</small></td>
      <td>${t.n}</td><td class="${t.g < 0 ? "neg" : ""}">${sign(t.g, 0)}${t.vel ? gauge(t.vel) : ""}</td></tr>`).join("")
    + `</table><p class="legend"><span class="gauge" aria-hidden="true"></span><span>Vert : gain habituel à cet âge (OMS) ; trait : Thomas.${list.some((t) => t.mixed) ? ` ${TREND_MIX}` : ""}</span></p>`
    + `<details class="how"><summary>Comment c'est calculé</summary><p>${TREND_HOW}</p><p>${TREND_WHO}</p>${all.some((p) => p.row.lieu === "maison") ? `<p>${TREND_HOME}</p>` : ""}</details>`;
  $("trend").innerHTML = html;
}
$("scaleChips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  scale = c.dataset.s;
  try { localStorage.setItem(SCALE_KEY, scale); } catch (e) {}
  renderTrend();
});

// ---------- Chart ----------
// One drawing function for the card (birth to now, P3-P97 always shown) and the full-screen view
// (any time window; the measure axis fits what is visible plus the percentile curves just around it).
let selected = null;
function niceStep(range, target) {
  const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw) || 10 * p;
}
const fullSpan = (pts) => { const a = pts.at(-1).ageF; return Math.max(14, Math.ceil(a + Math.max(4, a * 0.05))); };
const ZS = CURVES.map(([, z]) => z);
// The measure line at a given age (between two measures), or null outside them
function lineAt(pts, a) {
  for (let i = 1; i < pts.length; i++) if (pts[i - 1].ageF <= a && a <= pts[i].ageF) {
    const k = (a - pts[i - 1].ageF) / ((pts[i].ageF - pts[i - 1].ageF) || 1); return pts[i - 1].v + (pts[i].v - pts[i - 1].v) * k;
  }
  return null;
}
function drawChart({ pts, K, W, H, x0, x1, fit, id, big, plain }) { // plain: no selection marks (for the image export)
  const m = { l: big ? 44 : 40, r: 36, t: 10, b: 38 }, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const step = Math.max((x1 - x0) / 220, 0.05);
  const curveAt = (a, z) => { const p = lms(K.table, a); return p ? atZ(p, z) : null; };
  // y range
  let lo = Infinity, hi = -Infinity;
  const take = (v) => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } };
  const over = (z) => { for (let a = x0; a <= x1 + 1e-9; a += step) take(curveAt(a, z)); take(curveAt(x1, z)); };
  if (fit === "curves") { over(-1.881); over(1.881); pts.forEach((p) => take(p.v)); }
  else {
    // What is visible of the measures (points in the window, and the line where it crosses the edges)...
    const seen = pts.filter((p) => p.ageF >= x0 && p.ageF <= x1).map((p) => [p.ageF, p.v]);
    [x0, x1].forEach((a) => { const v = lineAt(pts, a); if (v != null) seen.push([a, v]); });
    if (!seen.length) seen.push(...pts.slice(-1).map((p) => [p.ageF, p.v]));
    seen.forEach(([, v]) => take(v));
    // ...and the percentile curves just below and just above it, so you always see where he stands
    const zs = seen.map(([a, v]) => zScore(K.table, Math.max(0, Math.round(a)), v)).filter((z) => z != null);
    if (zs.length) {
      const below = ZS.filter((z) => z <= Math.min(...zs)).at(-1), above = ZS.find((z) => z >= Math.max(...zs));
      if (below != null) over(below); if (above != null) over(above);
    }
    const minRange = K.unit === "kg" ? 0.1 : 1;
    if (hi - lo < minRange) { const c = (hi + lo) / 2; lo = c - minRange / 2; hi = c + minRange / 2; }
  }
  const yStep = niceStep(hi - lo, big ? Math.max(5, Math.round(ph / 50)) : 6);
  let y0, y1;
  if (fit === "curves") { y0 = Math.floor((lo - (hi - lo) * 0.02) / yStep) * yStep; y1 = Math.ceil((hi + (hi - lo) * 0.02) / yStep) * yStep; }
  else { const pad = (hi - lo) * 0.08; y0 = lo - pad; y1 = hi + pad; }
  const X = (a) => m.l + (a - x0) / (x1 - x0) * pw;
  const Y = (v) => m.t + (1 - (v - y0) / (y1 - y0)) * ph;
  const f1 = (n) => n.toFixed(1);
  let s = `<defs><clipPath id="${id}c"><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}"/></clipPath></defs>`;
  // y grid
  const dec = [0, 1, 2].find((d) => Math.abs(Math.round(yStep * 10 ** d) - yStep * 10 ** d) < 1e-6) ?? 2;
  for (let v = Math.ceil(y0 / yStep - 1e-9) * yStep; v <= y1 + 1e-9; v += yStep)
    s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/><text class="axis" x="${m.l - 6}" y="${f1(Y(v) + 4)}" text-anchor="end"><tspan>${nf(v, dec)}</tspan></text>`;
  // x grid: days when zoomed in close, then weeks, then months
  const span = x1 - x0, maxTicks = Math.max(3, Math.floor(pw / 40));
  let unit, ticks = [];
  if (span <= 35) {
    unit = "jours"; const st = [1, 2, 5, 7, 10, 14].find((e) => span / e <= maxTicks) || 14;
    for (let a = Math.ceil(x0 / st) * st; a <= x1; a += st) ticks.push([a, a]);
  } else if (span <= 182) {
    unit = "semaines"; const st = [1, 2, 4, 8, 13].find((e) => span / 7 / e <= maxTicks) || 13;
    for (let n = Math.ceil(x0 / 7 / st) * st; n * 7 <= x1; n += st) ticks.push([n * 7, n]);
  } else {
    unit = "mois"; const st = [1, 2, 3, 6, 12, 24].find((e) => span / 30.44 / e <= maxTicks) || 24;
    for (let n = 0; n <= 240; n += st) { const a = Thomas.daysBetween(Thomas.BIRTH_DAY, Thomas.addMonths(Thomas.BIRTH_DAY, n)); if (a > x1) break; if (a >= x0) ticks.push([a, n]); }
  }
  ticks.forEach(([a, n]) => {
    const atCorner = X(a) - m.l < 6; // the label at the corner sits to the right so it doesn't touch the lowest y label
    s += `<line class="grid" x1="${f1(X(a))}" x2="${f1(X(a))}" y1="${m.t}" y2="${H - m.b}" opacity=".6"/><text class="axis" x="${f1(atCorner ? X(a) + 2 : X(a))}" y="${H - m.b + 16}" text-anchor="${atCorner ? "start" : "middle"}">${n}</text>`;
  });
  s += `<text class="axis-title" x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">Âge (${unit})</text>`;
  // Percentile curves, clipped to the plot
  const curve = (z) => { const out = []; for (let a = x0; a <= x1 + 1e-9; a += step) { const v = curveAt(a, z); if (v != null) out.push([X(a), Y(v)]); } const v = curveAt(x1, z); if (v != null) out.push([X(x1), Y(v)]); return out; };
  const path = (c) => "M" + c.map(([x, y]) => `${f1(x)} ${f1(y)}`).join(" L");
  const c15 = curve(-1.036), c85 = curve(1.036);
  s += `<g clip-path="url(#${id}c)"><path class="band" d="${path(c15)} L${c85.reverse().map(([x, y]) => `${f1(x)} ${f1(y)}`).join(" L")} Z"/>`;
  const labels = [];
  CURVES.forEach(([name, z, cls]) => { const c = curve(z); s += `<path class="${cls}" d="${path(c)}"/>`; labels.push([name, c.at(-1)[1]]); });
  // Measures
  s += `<path class="line" d="${path(pts.map((p) => [X(p.ageF), Y(p.v)]))}"/>`;
  const sel = plain ? -1 : selected, sp = pts[sel];
  if (sp) s += `<line class="guide" x1="${f1(X(sp.ageF))}" x2="${f1(X(sp.ageF))}" y1="${m.t}" y2="${H - m.b}"/>`;
  const r = big ? 3.6 : 3.2;
  pts.forEach((p, i) => { if (p.ageF >= x0 - span * 0.05 && p.ageF <= x1 + span * 0.05)
    s += `<circle class="pt${i === pts.length - 1 ? " last" : ""}${i === sel ? " on" : ""}" cx="${f1(X(p.ageF))}" cy="${f1(Y(p.v))}" r="${i === sel || i === pts.length - 1 ? r + 0.8 : r}"/>`; });
  if (sp) s += `<circle class="sel" cx="${f1(X(sp.ageF))}" cy="${f1(Y(sp.v))}" r="${r + 4}"/>`;
  s += `</g>`;
  // Curve names on the right, pushed apart when they're close
  const shown = labels.filter(([, y]) => y > m.t - 2 && y < H - m.b + 2).sort((a, b) => a[1] - b[1]);
  for (let i = 1; i < shown.length; i++) shown[i][1] = Math.max(shown[i][1], shown[i - 1][1] + 12);
  shown.forEach(([name, y]) => { s += `<text class="curve-label${name === "P50" ? " p50l" : ""}" x="${W - m.r + 4}" y="${f1(y + 4)}">${name}</text>`; });
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${K.title}, ${pts.length} mesures">${s}</svg>`;
  return { svg, m, pw, X, Y, invX: (px) => x0 + (px - m.l) / pw * (x1 - x0) };
}
// Text about the selected measure
function tipText(pts, i, oneLine) {
  const sp = pts[i], g = kind === "poids" && gainOf(pts, i), br = oneLine ? " · " : "<br>";
  const v = velOf(g);
  const gain = g ? `${br}<span class="nw">${sign(g.g, 0)} g/j</span> sur <span class="nw">${span(g.days)}</span>${oneLine ? "" : ` (depuis le ${fmtDate(g.from.day)})`}`
    + (v ? ` · <span class="nw">habituel ${usual(v)}</span>` : "") : "";
  return `<b>${when(sp, true)}</b>${sp.row.lieu ? ` · ${Growth.lieuName(sp.row.lieu)}` : ""} · ${Thomas.short(sp.day)}${br}<b>${fmtV(sp.v)}</b> · ${sp.z == null ? "" : `<span class="nw">${pctText(sp.z)} (z ${sign(sp.z)})</span>`}${gain}`;
}
function renderChart() {
  const K = KINDS[kind], pts = points(), box = $("chart");
  $("chartTitle").textContent = K.title;
  $("fsOpen").hidden = !pts.length;
  if (!pts.length) { box.innerHTML = ""; $("tip").textContent = ""; return; }
  if (selected == null || selected >= pts.length) selected = pts.length - 1;
  const W = Math.max(280, box.clientWidth), H = Math.round(Math.min(380, Math.max(260, W * 0.8)));
  const c = drawChart({ pts, K, W, H, x0: 0, x1: fullSpan(pts), fit: "curves", id: "card" });
  box.innerHTML = c.svg;
  box.querySelector("svg").style.height = "auto";
  // Tap anywhere on the chart: the nearest measure in time
  box.querySelector("svg").addEventListener("click", (e) => {
    const r = e.currentTarget.getBoundingClientRect(), a = c.invX((e.clientX - r.left) * W / r.width);
    let best = 0; pts.forEach((p, i) => { if (Math.abs(p.ageF - a) < Math.abs(pts[best].ageF - a)) best = i; });
    selected = best; renderChart();
  });
  $("tip").innerHTML = tipText(pts, selected);
  if (!$("fs").hidden) renderFS();
}

// ---------- Full screen ----------
const fs = { views: {}, rot: false, pointers: new Map(), gesture: null, lastTap: 0, frame: 0, chart: null };
const fsBox = $("fsChart");
function fsView(pts) { // the time window for this tab, kept while the page is open
  const full = fullSpan(pts), v = fs.views[kind] || (fs.views[kind] = { x0: 0, x1: full });
  return clampView(v, full);
}
function clampView(v, full) {
  const minSpan = Math.min(3, full);
  let span = Math.max(minSpan, Math.min(full, v.x1 - v.x0)), x0 = Math.max(0, Math.min(full - span, v.x0));
  v.x0 = x0; v.x1 = x0 + span; return v;
}
function renderFS() {

function wrap(c, text, width) {

  for (const word of text.split(" ")) { const t = line ? `${line} ${word}` : word; if (line && c.measureText(t).width > width) { out.push(line); line = word; } else line = t; }
  return line ? [...out, line] : out;
}
// Keep only what is drawn: white borders cut to the same small margin all around
function cropToContent(src, margin) {
  const ctx = src.getContext("2d"), W = src.width, H = src.height, BAND = 128;
  let x0 = W, x1 = -1, y0 = -1, y1 = -1;
  const ink = (d, k) => d[k] < 246 || d[k + 1] < 246 || d[k + 2] < 246;
  for (let y = 0; y < H; y += BAND) {
    const h = Math.min(BAND, H - y), d = ctx.getImageData(0, y, W, h).data;
    for (let j = 0; j < h; j++) {
      const row = j * W * 4; let a = 0;
      while (a < W && !ink(d, row + a * 4)) a++;
      if (a === W) continue;
      let b = W - 1; while (b > a && !ink(d, row + b * 4)) b--;
      x0 = Math.min(x0, a); x1 = Math.max(x1, b); if (y0 < 0) y0 = y + j; y1 = y + j;
    }
  }
  if (x1 < 0) return src;
  const w = x1 - x0 + 1, h = y1 - y0 + 1, out = document.createElement("canvas");
  out.width = w + 2 * margin; out.height = h + 2 * margin;
  const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, out.width, out.height);
  o.drawImage(src, x0, y0, w, h, margin, margin, w, h);
  src.width = src.height = 0; // frees its memory right away (iPhone)
  return out;
}
async function buildExport() {
  try { await document.fonts.ready; } catch (e) {}
  const INK = "#1d2b2a", MUTED = "#5d706d", ACC = "#1f6f78", LINE = "#d5e0dc", LVL = { ok: "#2f8f55", near: "#b36b12", out: "#c4553f" }, RED = "#c4553f";
  const BODY = '"Atkinson Hyperlegible", Helvetica, Arial, sans-serif', DISP = '"Ubuntu", Helvetica, Arial, sans-serif';
  const HEAD = `700 13px ${BODY}`, CELL = `15px ${BODY}`, NOTE = `13px ${BODY}`;
  const m = document.createElement("canvas").getContext("2d"); // to measure text before the page size is known
  const pad = 40, ch = 430, rowH = 30;
  const kinds = Object.keys(KINDS).filter((k) => points(k).length);
  const all = Growth.rows().sort((a, b) => tsOf(a) - tsOf(b)), weightsPts = points("poids");
  const at = (p) => `${fmtDate(p.day, true)} ${fmtTime(p.t, p.row.fuseau)}`;

  // Trend of the weight gain (with the scale chosen on screen)
  const trendList = weightsPts.length ? Growth.trends(scalePts(weightsPts)) : [];
  const T_COLS = ["Période", "Du", "Au", "Pesées", "Poids (kg)", "Gain moyen", "Habituel (OMS)", "Lecture"];
  const tRows = trendList.map((t) => {
    const lvl = t.vel && Growth.velLevel(t.vel.z);
    return [[`${t.days} jours${t.mixed ? " *" : ""}${offSpan(t) ? ` (${Math.round(t.span)} j)` : ""}`, INK], [at(t.from), INK], [at(t.to), INK], [String(t.n), INK],
      [`${nf(t.from.v, 3)} → ${nf(t.to.v, 3)}`, INK], [`${sign(t.g, 0)} g/j`, lvl ? LVL[lvl] : t.g < 0 ? RED : INK],
      [t.vel ? `${range(t.vel)} g/j` : "—", MUTED], [t.vel ? Growth.velWords(t.vel.z) : "", lvl ? LVL[lvl] : MUTED]];
  });
  // Every measure, oldest first, like the health record; the place and note columns only when there is one
  const pct = (table, x, v) => { const z = v == null ? null : zScore(table, x, v); return z == null ? "" : pctText(z); };
  let M_COLS = ["Date", "Heure", "Lieu", "Âge", "Poids (kg)", "P", "g/j", "Habituel", "Taille (cm)", "P", "P. crânien (cm)", "P", "Note"];
  let mRows = all.map((r) => {
    const age = Thomas.daysBetween(Thomas.BIRTH_DAY, r.jour), wi = weightsPts.findIndex((p) => p.row.id === r.id), g = wi >= 0 ? gainOf(weightsPts, wi) : null;
    const v = velOf(g), lvl = v && Growth.velLevel(v.z);
    return [[fmtDate(r.jour, true), INK], [fmtTime(tsOf(r), r.fuseau), INK], [Growth.lieuName(r.lieu), INK], [`${age} j`, INK],
      [r.poids_g == null ? "" : nf(r.poids_g / 1000, 3), INK], [r.poids_g == null ? "" : pct("wfa", age, r.poids_g / 1000), INK],
      [g ? sign(g.g, 0) : "", lvl ? LVL[lvl] : g && g.g < 0 ? RED : INK], [v ? `${nf(Math.max(0, v.lo))}–${nf(v.hi)}` : g ? "1res sem." : "", MUTED],
      [r.taille_cm == null ? "" : nf(Number(r.taille_cm), 1), INK], [pct("lhfa", age, r.taille_cm == null ? null : Number(r.taille_cm)), INK],
      [r.pc_cm == null ? "" : nf(Number(r.pc_cm), 1), INK], [pct("hcfa", age, r.pc_cm == null ? null : Number(r.pc_cm)), INK], [r.note || "", MUTED]];
  });

  M_COLS = M_COLS.filter((n, i) => keep[i]); mRows = mRows.map((r) => r.filter((x, i) => keep[i]));

  const tW = colWidths(m, T_COLS, tRows, HEAD, CELL), mW = colWidths(m, M_COLS, mRows, HEAD, CELL, 340);
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const CW = Math.max(980, sum(tW), sum(mW)), W = CW + 2 * pad;
  m.font = NOTE;
  const scaleWord = scale ? ` (balance : ${Growth.lieuName(scale, true)} seulement)` : "";
  const tNotes = [TREND_HOW, TREND_WHO, ...(trendList.some((t) => t.mixed) ? [TREND_MIX] : [])].flatMap((t) => wrap(m, t, CW));
  const mNotes = [`THOMAS911 · percentiles OMS 2006 (garçons) · g/j : gain par 24 h depuis la pesée d'avant, calculé entre les heures de pesée (au moins 12 h d'écart).`,
    `Habituel : gain des garçons du même âge entre P15 et P85 (OMS 2009) ; g/j en vert dedans, orange un peu en dehors, rouge au-delà de P5–P95.`].flatMap((t) => wrap(m, t, CW));
  const H = 140 + (trendList.length ? 50 + 34 + trendList.length * rowH + 16 + tNotes.length * 19 + 40 : 0)
    + kinds.length * (ch + 56) + 34 + mRows.length * rowH + 30 + mNotes.length * 19 + 40;
  // Big enough to be sharp, small enough for the iPhone (about 16 million pixels per image at most)
  const SC = Math.max(1, Math.min(2, Math.sqrt(14e6 / (W * H))));
  const cv = document.createElement("canvas"); cv.width = Math.ceil(W * SC); cv.height = Math.ceil(H * SC);
  const c = cv.getContext("2d"); c.scale(SC, SC);
  c.fillStyle = "#fff"; c.fillRect(0, 0, W, H);
  const table = (cols, widths, rows, y) => {
    let x = pad; const xs = widths.map((w) => { const at = x; x += w; return at; }), right = x;
    c.font = HEAD; c.fillStyle = MUTED; cols.forEach((name, i) => c.fillText(name.toUpperCase(), xs[i], y + 22));
    y += 34; c.font = CELL;
    rows.forEach((r) => {
      c.strokeStyle = LINE; c.lineWidth = 1; c.beginPath(); c.moveTo(pad, y); c.lineTo(right, y); c.stroke();
      r.forEach(([t, color], i) => {
        let text = String(t);
        while (text && c.measureText(text).width > widths[i] - 12) text = text.slice(0, -2) + "…";
        c.fillStyle = color; c.fillText(text, xs[i], y + 21);

      y += rowH;

    c.strokeStyle = LINE; c.beginPath(); c.moveTo(pad, y); c.lineTo(right, y); c.stroke();

  };
  const notes = (lines, y) => { c.fillStyle = MUTED; c.font = NOTE; lines.forEach((l, i) => c.fillText(l, pad, y + i * 19)); return y + lines.length * 19; };
  // Title block
  const fam = Thomas.famille(), a = Thomas.age(), birth = Thomas.BIRTH.toLocaleString("fr-CA", { timeZone: fam.fuseau || "America/Toronto", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit" });
  c.fillStyle = INK; c.font = `800 30px ${DISP}`; c.fillText("Courbes de croissance de Thomas", pad, 50);
  c.fillStyle = MUTED; c.font = `16px ${BODY}`;
  c.fillText(`Né le ${birth}${fam.ville ? ` (heure de ${fam.ville})` : ""} · garçon · référentiel OMS 2006`, pad, 82);
  c.fillText(`${a.text.months} (${a.days} jours) le ${Thomas.fmtDay(Thomas.today(), { day: "numeric", month: "long", year: "numeric" })}`, pad, 106);
  let y = 140;
  // Trend first: what the doctor asks about
  if (trendList.length) {
    c.fillStyle = INK; c.font = `700 19px ${BODY}`; c.fillText(`Gain de poids moyen par 24 h${scaleWord}`, pad, y + 20);
    y = table(T_COLS, tW, tRows, y + 34);
    y = notes(tNotes, y + 24) + 30;
  }
  for (const k of kinds) {
    const K = KINDS[k], pts = points(k), last = pts.at(-1);
    c.fillStyle = INK; c.font = `700 19px ${BODY}`; c.textAlign = "left";
    c.fillText(`${K.title} (${K.unit})`, pad, y + 20);
    c.fillStyle = ACC; c.font = `700 16px ${BODY}`; c.textAlign = "right";
    c.fillText(`${fmtV(last.v, k)}${last.z == null ? "" : ` · ${pctText(last.z)}`} le ${fmtDate(last.day, true)}`, pad + CW, y + 20);
    c.textAlign = "left";
    const g = drawChart({ pts, K, W: CW, H: ch, x0: 0, x1: fullSpan(pts), fit: "curves", id: "x" + k, big: true, plain: true });
    c.drawImage(await svgImage(g.svg), pad, y + 32, CW, ch);
    y += ch + 56;
  }
  y = table(M_COLS, mW, mRows, y);

}
let exportFile = null, exportURL = null;
$("exportBtn").addEventListener("click", async () => {
  $("exp").showModal();
  $("expMsg").textContent = "Préparation de l'image…";
  $("expImg").removeAttribute("src"); $("expShare").hidden = true; $("expSave").disabled = true;
  try {
    const blob = await buildExport();
    exportFile = new File([blob], `croissance-thomas-${Thomas.today()}.png`, { type: "image/png" });
    if (exportURL) URL.revokeObjectURL(exportURL);
    exportURL = URL.createObjectURL(blob);
    $("expImg").src = exportURL;
    $("expMsg").textContent = "La tendance du gain, les trois courbes et le tableau des mesures, sur fond blanc.";
    $("expShare").hidden = !(navigator.canShare && navigator.canShare({ files: [exportFile] }));
    $("expSave").disabled = false;
  } catch (e) { $("expMsg").textContent = "Impossible de préparer l'image."; }
});
$("expShare").addEventListener("click", () => navigator.share({ files: [exportFile], title: "Courbes de croissance de Thomas" }).catch(() => {}));

$("expClose").addEventListener("click", () => $("exp").close());

render();
load();
// From the home page's "+ Pesée": straight to the entry sheet
